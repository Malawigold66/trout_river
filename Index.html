    const f=0.6*q.seg,m=2*q.seg,g=4*q.seg;
    for(let z=-T.Z/2;z<-T.mid;z+=g)zr.push(z);
    for(let z=-T.mid;z<-T.fine;z+=m)zr.push(z);
    for(let z=-T.fine;z<T.fine;z+=f)zr.push(z);
    for(let z=T.fine;z<T.mid;z+=m)zr.push(z);
    for(let z=T.mid;z<=T.Z/2+0.01;z+=g)zr.push(z);
    const nz=zr.length,n=(nx+1)*nz;
    const pos=new Float32Array(n*3),uv=new Float32Array(n*2),inf=new Float32Array(n*6),wd=new Float32Array(n);
    let v=0;
    for(let ix=0;ix<=nx;ix++){
      const x=-T.X/2+ix*sx,zc=H.zv(x);
      for(let j=0;j<nz;j++,v++){
        const z=zc+zr[j],h=H.height(x,z),I=H.Q;
        pos[v*3]=x;pos[v*3+1]=h;pos[v*3+2]=z;uv[v*2]=x/3;uv[v*2+1]=z/3;
        inf[v*6]=I.wl-h;inf[v*6+1]=I.p;inf[v*6+2]=I.outer;inf[v*6+3]=I.isl;inf[v*6+4]=I.fp;inf[v*6+5]=I.ter;
        wd[v]=I.wl-h;
      }
    }
    const ind=new Uint32Array(nx*(nz-1)*6);let w=0;
    for(let ix=0;ix<nx;ix++)for(let j=0;j<nz-1;j++){const a=ix*nz+j,b=a+1,d=a+nz,e=d+1;ind[w++]=a;ind[w++]=b;ind[w++]=d;ind[w++]=b;ind[w++]=e;ind[w++]=d;}
    const geo=new THREE.BufferGeometry();
    geo.setAttribute("position",new THREE.BufferAttribute(pos,3));H.TM={pos:pos,nx:nx,nz:nz,sx:sx,zr:zr,T:T};   /* COLLE1 : hauteurs du maillage dessine, lues par rvMeshH */
    geo.setAttribute("uv",new THREE.BufferAttribute(uv,2));
    geo.setAttribute("aWDepth",new THREE.BufferAttribute(wd,1));
    geo.setIndex(new THREE.BufferAttribute(ind,1));
    geo.computeVertexNormals();
    const nor=geo.attributes.normal,col=new Float32Array(n*3),ss=H.ss;
    let r,gg,b;
    const set=k=>{r=k[0];gg=k[1];b=k[2];};
    const mix=(k,f)=>{if(f<=0)return;if(f>1)f=1;r+=(k[0]-r)*f;gg+=(k[1]-gg)*f;b+=(k[2]-b)*f;};
    for(v=0;v<n;v++){
      const x=pos[v*3],z=pos[v*3+2],depth=inf[v*6],p=inf[v*6+1],outer=inf[v*6+2],isl=inf[v*6+3],fp=inf[v*6+4],ny0=nor.getY(v);
      let ny=ny0;if(H.UC&&depth<-0.7){const uq=H.query(x,z);if(H.UC[uq.i]>0.02&&uq.lat*H.UCS[uq.i]>0)ny=Math.max(ny0,0.97);}/* BLOC AJUST8 : haut de berge = herbe de la plaine */
      const n1=H.fbm(x*0.08,z*0.08),n2=H.noise(x*1.1,z*1.1),n3=H.fbm(x*0.02+5,z*0.02);
      if(depth>0.02){                                  // sous l'eau
        set(C.gravelL);mix(C.gravelD,n2*0.7);mix(C.silt,p*ss(0.3,1.5,depth)*0.8);
      }else{                                           // hors de l'eau
        const above=-depth;
        set(C.grass1);mix(C.grass2,ss(0.45,0.75,n1));mix(C.grass3,(1-ss(0.3,0.55,n3))*0.7);
        if(fp<1)mix(C.meadow,0.35*ss(0.3,0.8,n3));       // prairie du lit majeur
        mix(C.forest,ss(1.08,1.45,fp)*0.85);              // versants boises
        mix(C.soil,(1-ss(0.6,0.85,ny))*0.9);mix(C.rock,(1-ss(0.4,0.55,ny))*0.5);
        mix(C.wet,(1-ss(0.05,0.4,above))*0.75);

    // Reflets de lumiere ondulants sur le fond (caustiques), seulement sous l'eau
    mat.onBeforeCompile=sh=>{
      sh.uniforms.uTime=c.U.time;sh.uniforms.uSunC=c.U.sunCol;sh.uniforms.uCaust=c.U.caust;
      sh.vertexShader="attribute float aWDepth;\nvarying float vWD;\nvarying vec3 vWP;\n"+
        sh.vertexShader.replace("#include <begin_vertex>","#include <begin_vertex>\nvWD=aWDepth;vWP=(modelMatrix*vec4(transformed,1.0)).xyz;");
      sh.fragmentShader="uniform float uTime;\nuniform vec3 uSunC;\nuniform float uCaust;\nvarying float vWD;\nvarying vec3 vWP;\n"+c.GLSL_NOISE+
        sh.fragmentShader.replace("#include <map_fragment>",`#ifdef USE_MAP
          vec4 texelColor=texture2D(map,vUv);   /* texture du sol a 3 echelles */
          texelColor.rgb*=(0.45+0.65*texture2D(map,vUv*0.173+vec2(0.37,0.11)).r)*(0.82+0.22*texture2D(map,vUv*4.1).r);
          texelColor=mapTexelToLinear(texelColor);diffuseColor*=texelColor;
          #endif`).replace("#include <fog_fragment>",
        `if(uCaust>0.5&&vWD>0.02){vec2 cp=vWP.xz*0.55;float tt=uTime*0.6;
          float r1=1.0-abs(rvNoise(cp+vec2(tt,tt*0.7))*2.0-1.0),r2=1.0-abs(rvNoise(cp*1.7-vec2(tt*0.8,-tt*0.5)+3.1)*2.0-1.0);
          float ca=pow(r1*r2,6.0)*3.0,kd=smoothstep(0.02,0.15,vWD)*(1.0-smoothstep(0.4,2.4,vWD));
          gl_FragColor.rgb+=uSunC*ca*kd*0.14;}   /* CAUSTIQUES2 : reflets un peu moins brillants */
        #include <fog_fragment>`);
    };
    const mesh=new THREE.Mesh(geo,mat);mesh.castShadow=true;mesh.receiveShadow=true;mesh.name="terrain";
    return mesh;
  }
});

/* ===== BLOC EAU2 (donnees : vitesse de l'eau par troncon) ===== */
/* Le courant VISUEL suit la vitesse du moteur (Q / section, rvGranulo) : plus rapide en radier, plus lent en mouille.
   Methode : coordonnee d'ecoulement deformee X'(s) = somme de ds / c(s) ; le motif d'ondes avance a la vitesse c0 dans X', donc a c0 x c(s) dans le lit,
   sans derive dans le temps. c = (u / mediane)^0,8, borne entre RVFLO.cmin et RVFLO.cmax. Le curseur "Vitesse du courant (visuelle)" reste un multiplicateur global. */
const RVUWC={part:true,link:true};   /* defauts : cochees (choix de l'utilisateur, 26 oct.) */
const RVFLO={cmin:0.55,cmax:1.7,lisse:6,expo:0.8};
Object.assign(I18N,{uwPart:{fr:"Particules en suspension sous l'eau",en:"Suspended particles underwater"},
  flowLink:{fr:"Courant visuel lié à la vitesse par tronçon (radier / mouille)",en:"Visual current tied to speed per reach (riffle / pool)"}});
function rvFlowBuild(H){
  const N=H.N,U=new Float32Array(N),Kc=new Float32Array(N).fill(1),X=new Float64Array(N),raw=new Float32Array(N),sm=new Float32Array(N);
  let G=null;try{G=(H.GR&&H.GR.vel)?H.GR:rvGranulo(H);}catch(e){G=null;}
  const um=(typeof GRN!=="undefined"&&GRN.umax)||3;
  for(let i=0;i<N;i++){const a=G&&G.A?G.A[i]:0;raw[i]=(a>0.05&&G.Qd>0)?Math.min(um,G.Qd/a):0.2+0.9*(1-H.P[i]);}
  for(let i=0;i<N;i++){let t=0,n=0;for(let j=Math.max(0,i-RVFLO.lisse);j<=Math.min(N-1,i+RVFLO.lisse);j++){t+=raw[j];n++;}sm[i]=t/n;}
  const srt=Array.from(sm).sort((p,q)=>p-q),med=srt[srt.length>>1]||1;
  X[0]=H.S[0];
  for(let i=0;i<N;i++){U[i]=sm[i];Kc[i]=Math.min(RVFLO.cmax,Math.max(RVFLO.cmin,Math.pow(sm[i]/med,RVFLO.expo)));if(i>0)X[i]=X[i-1]+(H.S[i]-H.S[i-1])/Kc[i];}
  const ic=Math.max(0,Math.min(N-1,H.idx(0))),dx=H.S[ic]-X[ic];
  for(let i=0;i<N;i++)X[i]+=dx;
  window.RVFLOW={u:U,k:Kc,med:med,at(x,z){const q=H.query(x,z),i=Math.max(0,Math.min(N-1,q.i));return {i:i,u:U[i],k:Kc[i]};}};
  return X;
}
function rvFlowApply(){
  const m=MODS.find(x=>x.id==="eau"),F=window.RVFL;if(!m||!m.obj||!F||!m.obj.geometry)return;
  const at=m.obj.geometry.attributes.aFlow;if(!at)return;
  const S=RVUWC.link?F.W:F.S,A=at.array;for(let v=0;v<S.length;v++)A[2*v]=S[v];at.needsUpdate=true;
}
(function(){const a=document.getElementById("ckUWPart"),b=document.getElementById("ckFlowLink");
  if(a)a.onchange=()=>{RVUWC.part=a.checked;};
  if(b)b.onchange=()=>{RVUWC.link=b.checked;rvFlowApply();};})();
/* ===== FIN BLOC EAU2 (donnees) ===== */

/* ----- Module : eau de la riviere (ruban qui suit le lit) ----- */
defModule({id:"eau",nom:{fr:"Eau",en:"Water"},
  build(c){
    const H=c.HY,T=c.CFG.terrain,st=c.Q.waterStep,M=c.Q.waterAcross,mg=c.CFG.water.margin;
    const RVX=rvFlowBuild(H),RVXS=[],RVXW=[];window.RVFL={S:RVXS,W:RVXW};   /* EAU2 : abscisse d'origine (S) et abscisse deformee par la vitesse (W) */
    // grille des rochers pour l'ecume (cellules de 4 m)
    const grid=new Map(),cell=4,gk=(i,j)=>i+":"+j;
    for(const rk of H.ROCKS){if(!rk.inCh||(rk.cls===0&&!rk.em))continue;const k=gk(Math.floor(rk.x/cell),Math.floor(rk.z/cell));(grid.get(k)||grid.set(k,[]).get(k)).push(rk);}
    const rockFoam=(x,z)=>{let m=0;const ci=Math.floor(x/cell),cj=Math.floor(z/cell);
      for(let a=-4;a<=4;a++)for(let b=-4;b<=4;b++){const L=grid.get(gk(ci+a,cj+b));if(!L)continue;
        for(const rk of L){const dx=x-rk.x,dz=z-rk.z,al=dx*rk.tx+dz*rk.tz,pr=-dx*rk.tz+dz*rk.tx;
          const d=Math.hypot(al>0?al/(1.5+0.6*rk.r):al*1.3,pr);          // sillage etire vers l'aval
          const f=(1-H.ss(rk.r*0.75,rk.r*1.4+1.6,d))*(rk.em?1:1-H.ss(0,0.35,rk.gap));if(f>m)m=f;}}
      return m;};
    const iA=H.idx(-T.X/2),iB=H.idx(T.X/2),rows=Math.floor((iB-iA)/st)+1,n=rows*M;
    const P=new Float32Array(n*3),Dp=new Float32Array(n),Sp=new Float32Array(n),Fl=new Float32Array(n*2),Rk=new Float32Array(n);
    let v=0;
    for(let r=0;r<rows;r++){
      const i=iA+r*st,hw=H.HW[i]+mg;
      for(let q=0;q<M;q++,v++){
        const lat=-hw+2*hw*q/(M-1),x=H.X[i]+H.NX[i]*lat,z=H.Zc[i]+H.NZ[i]*lat;
        P[v*3]=x;P[v*3+1]=H.WL[i];P[v*3+2]=z;
        Dp[v]=H.WL[i]-H.height(x,z);
        const u=lat/H.HW[i];
        Sp[v]=(0.3+0.9*(1-H.P[i]))*Math.max(0.15,1-0.7*u*u);
        Fl[v*2]=RVUWC.link?RVX[i]:H.S[i];Fl[v*2+1]=lat;Rk[v]=rockFoam(x,z);RVXS[v]=H.S[i];RVXW[v]=RVX[i];
      }
    }
    const idx=new Uint32Array((rows-1)*(M-1)*6);let w=0;
    for(let r=0;r<rows-1;r++)for(let q=0;q<M-1;q++){const a=r*M+q,b=a+1,d=a+M,e=d+1;idx[w++]=a;idx[w++]=b;idx[w++]=d;idx[w++]=b;idx[w++]=e;idx[w++]=d;}
    const g=new THREE.BufferGeometry();
    g.setAttribute("position",new THREE.BufferAttribute(P,3));
    g.setAttribute("aDepth",new THREE.BufferAttribute(Dp,1));
    g.setAttribute("aSpeed",new THREE.BufferAttribute(Sp,1));
    g.setAttribute("aFlow",new THREE.BufferAttribute(Fl,2));
    g.setAttribute("aRock",new THREE.BufferAttribute(Rk,1));
    g.setIndex(new THREE.BufferAttribute(idx,1));g.computeBoundingSphere();
    const mesh=new THREE.Mesh(g,makeWaterMat(c,c.CFG.waterCol.shallow,c.CFG.waterCol.deep));
    mesh.material.side=THREE.DoubleSide;mesh.renderOrder=2;mesh.name="eau";return mesh;
  },
  update(c){const m=this.obj.material;this.obj.visible=c.ST.flood<0.05;updWaterMat(m,c);m.uniforms.uTurb.value=c.ST.turb;}
});

/* ----- Module : remous autour des rochers (decalques d'eau : film d'ecume au contact, leger bourrelet amont, sillage grenu etire dans le sens du courant) ----- */
defModule({id:"remous",nom:{fr:"Remous autour des rochers",en:"Flow around rocks"},
  build(c){
    const H=c.HY,T=c.CFG.terrain,L=[];
    for(const rk of H.ROCKS){
      if(rk.r<0.16||Math.abs(rk.x)>T.X/2||!(rk.inCh||rk.em)||(rk.cls===0&&!rk.em))continue;
      if(!rk.em&&rk.gap>Math.max(0.12,rk.r*0.8))continue;
      L.push(rk);if(L.length>=900)break;}
    const n=L.length,P=new Float32Array(n*12),Lc=new Float32Array(n*8),K=new Float32Array(n*16),B=new Float32Array(n*12),I=new Uint32Array(n*6);
    L.forEach((rk,k)=>{
      const r=rk.r,up=1.4*r+0.6,dn=4.5*r+2.6,w=3.0*r+1.3,y=(rk.wl!==undefined?rk.wl:0)+0.045,tx=rk.tx,tz=rk.tz,px=-rk.tz,pz=rk.tx;
      const sub=rk.em?1:Math.max(0,1-rk.gap/Math.max(0.12,r*0.8)),sd=((k*7919)%1000)/1000;
      [[-up,-w],[dn,-w],[dn,w],[-up,w]].forEach((ab,j)=>{const v=k*4+j;
        P[v*3]=rk.x+tx*ab[0]+px*ab[1];P[v*3+1]=y;P[v*3+2]=rk.z+tz*ab[0]+pz*ab[1];
        Lc[v*2]=ab[0];Lc[v*2+1]=ab[1];K[v*4]=r;K[v*4+1]=rk.em?1:0;K[v*4+2]=sub;K[v*4+3]=sd;
        B[v*3]=up;B[v*3+1]=dn;B[v*3+2]=w;});
      const a=k*4,ux=P[(a+1)*3]-P[a*3],uz=P[(a+1)*3+2]-P[a*3+2],vx=P[(a+3)*3]-P[a*3],vz=P[(a+3)*3+2]-P[a*3+2];
      const q=(uz*vx-ux*vz)>0?[a,a+1,a+2,a,a+2,a+3]:[a,a+2,a+1,a,a+3,a+2];for(let m=0;m<6;m++)I[k*6+m]=q[m];});
    const g=new THREE.BufferGeometry();
    g.setAttribute("position",new THREE.BufferAttribute(P,3));g.setAttribute("aLoc",new THREE.BufferAttribute(Lc,2));
    g.setAttribute("aK",new THREE.BufferAttribute(K,4));g.setAttribute("aB",new THREE.BufferAttribute(B,3));
    g.setIndex(new THREE.BufferAttribute(I,1));g.computeBoundingSphere();
    const u={uTime:U.time,uFlow:{value:1},uAnim:{value:1},uFoam:{value:1},uFogOn:{value:1},uFogNear:{value:c.CFG.fog.near},uFogFar:{value:c.CFG.fog.far},
      uSunDir:{value:new THREE.Vector3()},uSunCol:{value:new THREE.Color()},uHorizon:{value:new THREE.Color()},uZenith:{value:new THREE.Color()},uFogCol:{value:new THREE.Color()}};
    const m=new THREE.ShaderMaterial({uniforms:u,transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2,
      vertexShader:`attribute vec2 aLoc;attribute vec4 aK;attribute vec3 aB;
        varying vec2 vL;varying vec4 vK;varying vec3 vB;varying vec3 vWorld;
        void main(){vL=aLoc;vK=aK;vB=aB;vec4 wp=modelMatrix*vec4(position,1.0);vWorld=wp.xyz;gl_Position=projectionMatrix*viewMatrix*wp;}`,
      fragmentShader:`uniform float uTime,uFlow,uAnim,uFoam,uFogOn,uFogNear,uFogFar;
        uniform vec3 uSunDir,uSunCol,uHorizon,uZenith,uFogCol;
        varying vec2 vL;varying vec4 vK;varying vec3 vB;varying vec3 vWorld;
        `+c.GLSL_NOISE+`
        float sq(float x){return x*x;}
        void main(){
          float r=vK.x,em=vK.y,sub=vK.z,sd=vK.w;
          float al=vL.x,pr=vL.y,d=length(vL),aft=max(al,0.0);
          float t=uTime*uAnim*uFlow*0.6;
          float rw=r*(0.55+0.4*em);
          float up=clamp(-al/max(d,0.001),0.0,1.0);
          vec2 wp=vWorld.xz+vec2(11.0,3.0);
          vec2 lc=vec2(al+sd*17.0,pr+3.0);
          float nzf=rvNoise(wp*13.0);
          float side=0.45+0.55*max(up,abs(pr)/max(d,0.001)*0.8);
          float ring=exp(-sq((d-rw-0.02)/(0.035+0.03*r)))*side*smoothstep(0.30,0.62,nzf+0.15*rvFbm(wp*3.0))*em;
          float bow=exp(-sq(max(d-rw,0.0)/(0.16*r+0.07)))*pow(up,2.2)*em*smoothstep(0.25,0.6,rvFbm(wp*5.0-vec2(t,0.0)));
          float spread=0.85*rw+0.07+0.20*aft;

          float s1=rvFbm(vec2(lc.x*0.9-t*2.0,yw*6.0)),s2=rvFbm(vec2(lc.x*1.6-t*2.6+4.0,yw*10.0));

          float grain=smoothstep(0.38,0.72,rvFbm(vec2(lc.x*8.0-t*2.6,lc.y*8.0))*0.7+rvNoise(vec2(lc.x*17.0-t*3.0,lc.y*17.0))*0.3);
          float wake=clamp(wedge*1.15,0.0,1.0)*streak*(0.40+0.60*grain)+0.30*wedge*wedge*smoothstep(0.0,1.2*rw+0.2,al)*(1.0-smoothstep(0.6*r+0.4,2.6*r+1.6,al));
          float foam=clamp(ring*0.8+bow*0.6+wake*0.9,0.0,1.0)*uFoam;
          float lum=0.40+0.60*min(1.0,length(uSunCol)*0.62);

          gl_FragColor=vec4(col,a);
          #include <tonemapping_fragment>
          #include <encodings_fragment>
        }`});
    m.userData.rvWater=true;const mesh=new THREE.Mesh(g,m);mesh.renderOrder=3;mesh.name="remous";return mesh;
  },
  update(c){if(!this.obj)return;this.obj.visible=this.on&&c.ST.flood<0.05;if(this.obj.visible)updWaterMat(this.obj.material,c);}

/* ----- UC : sous-berges, partie terrain (BLOC AJUST7). Toute la rive exterieure de chaque mouille (virage), puis le relief est creuse : une cavite derriere l'ancien bord
   de l'eau (le lit plonge au pied de la berge, la berge verticale recule), sous un surplomb pose par le module sous-berges ----- */
function rvUC(H){
  const N=H.N,UC=new Float32Array(N),UCS=new Int8Array(N),UCC=new Float32Array(N),R=[],T=CFG.terrain,so=(H.seed%97)+3.1,ss=H.ss;
  const iA=H.idx(-T.X/2+8),iB=H.idx(T.X/2-8),G=new Uint8Array(N),SG=new Int8Array(N);
  for(let i=iA;i<iB;i++){const vp=H.VP[i],a=Math.min(1,Math.abs(vp)*2),p=H.P[i];
    if(a<0.22||p<0.22)continue;
    if(H.ISL.some(o=>Math.abs(o.s-H.S[i])<o.a*1.5))continue;
    const sg=vp>0?1:-1,lt=sg*(H.HW[i]+1.5),px=H.X[i]+H.NX[i]*lt,pz=H.Zc[i]+H.NZ[i]*lt;
    if((H.AFF||[]).some(a=>{const q=a.hit(px,pz);return q&&Math.abs(q.lat)<a.sm.HW[q.bi]+AFFC.bw+3;}))continue;

/* ----- Module : crue (nappe d'eau boueuse sur le lit majeur, curseur "Crue") ----- */
defModule({id:"crue",nom:{fr:"Eau de crue",en:"Floodwater"},
  build(c){
    const H=c.HY,T=c.CFG.terrain,V=c.CFG.valley,s=c.Q.floodStep,half=V.fpHalf*1.3+V.terraceW+6;
    const nx=Math.round(T.X/s),nz=Math.round(2*half/s)+1,n=(nx+1)*nz;
    const P=new Float32Array(n*3),Dp=new Float32Array(n),Sp=new Float32Array(n).fill(0.5),Fl=new Float32Array(n*2),Rk=new Float32Array(n);
    let v=0;

      for(let j=0;j<nz;j++,v++){const z=zc-half+j*s;P[v*3]=x;P[v*3+1]=wl;P[v*3+2]=z;Dp[v]=wl-H.height(x,z);Fl[v*2]=x;Fl[v*2+1]=z-zc;}}

    for(let ix=0;ix<nx;ix++)for(let j=0;j<nz-1;j++){const a=ix*nz+j,b=a+1,d=a+nz,e=d+1;idx[w++]=a;idx[w++]=b;idx[w++]=d;idx[w++]=b;idx[w++]=e;idx[w++]=d;}

      if(e2.lengthSq()<0.5)e2.set(0,1,0);
      const b=Lf.p.length/3;
      for(const q of [[-1,-1,0,0],[1,-1,1,0],[1,1,1,1],[-1,1,0,1]]){
        Lf.p.push(p.x+(e1.x*q[0]+e2.x*q[1])*s*0.5,p.y+(e1.y*q[0]+e2.y*q[1])*s*0.5,p.z+(e1.z*q[0]+e2.z*q[1])*s*0.5);
        Lf.u.push(q[2],q[3]);Lf.ctr.push(p.x,p.y,p.z);}
      Lf.i.push(b,b+1,b+2,b,b+2,b+3);
    }
  }
  function grow(p0,dir,len,ra,depth){
    const dd=V().copy(dir);if(depth>=sp.droopFrom){dd.y-=sp.droop;dd.normalize();}
    const mid=V().copy(p0).addScaledVector(dir,len*0.5).add(V(r()-0.5,(r()-0.5)*0.4,r()-0.5).multiplyScalar(sp.wig*len*0.12));
    const end=V().copy(mid).addScaledVector(dd,len*0.5),rm=ra*0.8,re=Math.max(0.012,ra*0.6);
    W.cd=depth;tube3(p0,mid,end,ra,rm,re,depth);
    if(depth>=sp.depth){leafCl(end,sp.leaf,sp.leafN);return;}
    if(depth>=sp.depth-1)leafCl(mid,sp.leaf*0.85,Math.ceil(sp.leafN*0.5));
    const nb=sp.nb[Math.min(depth,sp.nb.length-1)]+(r()<0.35?1:0),az0=r()*6.283;
    for(let k=0;k<nb;k++){
      const tt=sp.split[0]+(sp.split[1]-sp.split[0])*(nb>1?(k+r()*0.5)/nb:1);
      const st=tt<0.5?V().lerpVectors(p0,mid,tt*2):V().lerpVectors(mid,end,Math.min(1,(tt-0.5)*2));
      const az=az0+k*6.283/nb+(r()-0.5)*0.8,an=sp.ang*(0.7+0.6*r());
      const side=V(Math.cos(az),0,Math.sin(az));side.addScaledVector(dd,-side.dot(dd)).normalize();
      const nd=V().copy(dd).multiplyScalar(Math.cos(an)).addScaledVector(side,Math.sin(an));nd.y+=sp.up;nd.normalize();
      grow(st,nd,len*sp.lenF*(0.8+0.4*r()),ra*sp.radF,depth+1);
    }
  }
  if(sp.shrub){
    const ns=sp.stems[0]+Math.floor(r()*(sp.stems[1]-sp.stems[0]+1));
    for(let k=0;k<ns;k++){const az=r()*6.283,tl=0.15+r()*0.45;
      grow(V(Math.cos(az)*0.15,-0.2,Math.sin(az)*0.15),V(Math.cos(az)*Math.sin(tl),Math.cos(tl),Math.sin(az)*Math.sin(tl)),sp.len*(0.7+0.5*r()),sp.trunkR*(0.7+0.6*r()),0);}
  }else{
    const nt=r()<sp.multi?2:1;
    for(let k=0;k<nt;k++){const az=r()*6.283,tl=(nt>1?0.15:0)+sp.lean0*r(),o=nt>1?0.3:0;
      grow(V(Math.cos(az)*o,-0.4,Math.sin(az)*o),V(Math.cos(az)*Math.sin(tl),Math.cos(tl),Math.sin(az)*Math.sin(tl)),sp.len*(0.85+0.3*r()),sp.trunkR*(nt>1?0.75:1),0);}
  }
  // normales des feuilles orientees vers l'exterieur du houppier (aspect volumineux)
  let cx=0,cy=0,cz=0;const nv=Lf.ctr.length/3;
  for(let i=0;i<nv;i++){cx+=Lf.ctr[i*3];cy+=Lf.ctr[i*3+1];cz+=Lf.ctr[i*3+2];}
  cx/=nv||1;cy/=nv||1;cz/=nv||1;const Ln=[],tmp=V();
  for(let i=0;i<nv;i++){tmp.set(Lf.ctr[i*3]-cx,Lf.ctr[i*3+1]-cy,Lf.ctr[i*3+2]-cz).normalize().multiplyScalar(0.75);tmp.y+=0.55;tmp.normalize();Ln.push(tmp.x,tmp.y,tmp.z);}
  const gw=new THREE.BufferGeometry();
  gw.setAttribute("position",new THREE.Float32BufferAttribute(W.p,3));gw.setAttribute("normal",new THREE.Float32BufferAttribute(W.n,3));
  gw.setAttribute("color",new THREE.Float32BufferAttribute(W.c,3));gw.setAttribute("uv",new THREE.Float32BufferAttribute(W.u,2));gw.setAttribute("aBr",new THREE.Float32BufferAttribute(W.b,1));gw.setIndex(W.i);
  const gl=new THREE.BufferGeometry();
  gl.setAttribute("position",new THREE.Float32BufferAttribute(Lf.p,3));gl.setAttribute("normal",new THREE.Float32BufferAttribute(Ln,3));
  gl.setAttribute("uv",new THREE.Float32BufferAttribute(Lf.u,2));gl.setIndex(Lf.i);
  return {wood:gw,leaf:gl};
};
// Instancie des modeles d'arbres : liste d'emplacements {x,y,z,sc,rot,lean,ld,k}
VEG.place=function(grp,tpl,list,leafMat,depthMat,woodMat){
  const qY=new THREE.Quaternion(),qT=new THREE.Quaternion(),UP=new THREE.Vector3(0,1,0),ax=new THREE.Vector3(),
    M=new THREE.Matrix4(),Pv=new THREE.Vector3(),Sv=new THREE.Vector3(),col=new THREE.Color();
  tpl.forEach((tp,k)=>{
    const L=list.filter(t=>t.k===k);if(!L.length)return;
    const w=new THREE.InstancedMesh(tp.wood,woodMat,L.length),lf=new THREE.InstancedMesh(tp.leaf,leafMat,L.length);
    L.forEach((t,j)=>{qY.setFromAxisAngle(UP,t.rot);ax.set(Math.sin(t.ld),0,-Math.cos(t.ld));qT.setFromAxisAngle(ax,t.lean);
      qT.multiply(qY);M.compose(Pv.set(t.x,t.y-0.3,t.z),qT,Sv.setScalar(t.sc));w.setMatrixAt(j,M);lf.setMatrixAt(j,M);
      col.setRGB(0.82+0.3*t.cv[0],0.84+0.26*t.cv[1],0.8+0.25*t.cv[2]);lf.setColorAt(j,col);});
    w.castShadow=lf.castShadow=true;w.receiveShadow=lf.receiveShadow=true;lf.customDepthMaterial=depthMat;
    grp.add(w);grp.add(lf);
  });
};

/* ----- Module : ripisylve par tronçons (galerie dense, berge claire, berge degagee), 3 arbres + 3 arbustes ----- */
defModule({id:"ripisylve",nom:{fr:"Ripisylve et arbres",en:"Riparian trees"},
  build(c){
    const H=c.HY,q=c.Q,T=c.CFG.terrain,r=VEG.rng(H.seed*7+3),grp=new THREE.Group();
    const nT=q.key==="high"?3:q.key==="medium"?2:1,det=q.key==="high"?2:q.key==="medium"?1:0;
    const SPN=["aulne","saule","frene","osier","noisetier","cornouiller"],inst={},NTS={};
    SPN.forEach(s=>{inst[s]=[];NTS[s]=VEG.SP[s].shrub?Math.min(nT,2):nT;});
    const CR={aulne:4.0,saule:5.5,frene:3.7,osier:1.7,noisetier:2.0,cornouiller:1.6};   // rayon utile du houppier (m, avant echelle), mesure sur les arbres generes
    const SH=new Float32Array(H.N);H.CRW=[];   /* houppiers {x,z,rc}, pour les herbiers */                                                      // part de la largeur du lit couverte par les houppiers (0..1)
    const add=(s,x,z,sc,lean,ld)=>{if(Math.abs(x)>T.X/2-3)return false;const y=H.height(x,z);
      inst[s].push({x,y,z,sc,lean,ld,rot:r()*6.283,k:Math.floor(r()*NTS[s]),cv:[r(),r(),r()]});return true;};
    // ombrage : le houppier couvre une partie de la largeur du lit sur la longueur de son diametre
    const shade=(i,off,rc)=>{const n=Math.round(rc/H.ds),dist=H.HW[i]+off;
      for(let j=Math.max(0,i-n);j<=Math.min(H.N-1,i+n);j++){const dj=(j-i)*H.ds,cw=Math.sqrt(Math.max(0,rc*rc-dj*dj)),ov=Math.max(0,Math.min(H.HW[j],H.HW[j]-(dist-cw)));
        SH[j]=Math.min(1,SH[j]+ov/(2*H.HW[j]));}};
    // densite le long de chaque berge : 0 = berge degagee (plein soleil) ... 1 = galerie dense (ombre)
    // (65 % commun aux deux berges : sections entieres ombragees ou ensoleillees ; 35 % propre a chaque berge)
    const DEN=(side,s)=>{const m=RVRIP.dens,sh=m>1?0.2*(m-1):0;return H.ss(0.40-sh,0.54-sh,0.65*H.fbm(s/110,(H.seed%97)+1.5)+0.35*H.fbm(s/60+side*13,(H.seed%97)+5.5))*Math.min(1,m);};   // RIPISYLVE1 : densite x curseur
    // taches d'arbustes (20-40 m), independantes de la densite des arbres
    const SHB=(side,s)=>H.ss(0.52,0.66,H.fbm(s/24+side*7,(H.seed%89)+3.3));
    const iA=H.idx(-T.X/2+4),iB=H.idx(T.X/2-4);
    const tree=(i,side,off,s,sc)=>{const lat=side*(H.HW[i]+off),x=H.X[i]+H.NX[i]*lat,z=H.Zc[i]+H.NZ[i]*lat;
      if(H.height(x,z)<H.Q.wl+0.12)return;
      const ld=Math.atan2(-H.NZ[i]*side,-H.NX[i]*side);
      if(add(s,x,z,sc,s==="saule"?0.12+0.18*r():0.03+0.07*r(),ld)){shade(i,off,CR[s]*sc);H.CRW.push({x,z,rc:CR[s]*sc});}};
    for(const side of [-1,1]){
      // 1) arbres : plus ou moins serres selon le tronçon, penches vers l'eau
      let i=iA;
      while(true){
        i+=Math.round((4+r()*6)/H.ds/Math.max(1,RVRIP.dens));if(i>=iB)break;   // RIPISYLVE1 : espacement / densite au-dela de x1
        const d=DEN(side,H.S[i]);
        if(d<0.04||r()>0.25+0.75*d)continue;
        const u=r();
        tree(i,side,0.3+Math.pow(r(),1.4)*2.4,u<0.5?"aulne":u<0.85?"saule":"frene",0.75+0.45*r());        // rang de berge
        if(d>0.55&&r()<0.55){const u2=r();                                                                  // 2e rang, seulement en galerie dense
          tree(Math.min(iB-1,i+Math.round((r()*8-4)/H.ds)),side,3+r()*4.5,u2<0.45?"frene":u2<0.8?"aulne":"saule",0.8+0.4*r());}
      }
      // 2) arbustes par taches : saule buissonnant au pied de berge, noisetier et cornouiller en haut de berge
      i=iA;
      while(true){
        i+=Math.round((1.5+r()*2.5)/H.ds);if(i>=iB)break;
        const sb=SHB(side,H.S[i]);if(sb<0.08)continue;
        if(r()>sb*(0.9-0.4*DEN(side,H.S[i])))continue;
        const low=r()<0.45,off=low?r()*1.0:1.2+r()*3.5,lat=side*(H.HW[i]+off),x=H.X[i]+H.NX[i]*lat,z=H.Zc[i]+H.NZ[i]*lat;
        if(H.height(x,z)<H.Q.wl+(low?0.06:0.12))continue;
        add(low?"osier":(r()<0.55?"noisetier":"cornouiller"),x,z,0.75+0.45*r(),0.03,r()*6.283);
      }
    }
    // 3) osiers sur les ilots et le haut des bancs de convexite
    for(const o of H.ISL){const n=2+Math.floor(r()*4),p={};
      for(let k=0;k<n;k++){H.pointAt(o.i+(r()-0.5)*1.2*o.a/H.ds,o.lat+(r()-0.5)*o.b,p);
        if(H.height(p.x,p.z)>H.Q.wl+0.12)add(r()<0.75?"osier":"saule",p.x,p.z,0.7+0.4*r(),0.05,r()*6.283);}}
    for(let i=iA;i<iB;i+=12){if(Math.abs(H.VP[i])<0.3||r()>0.4)continue;
      const lat=-Math.sign(H.VP[i])*(H.HW[i]+2+r()*5),x=H.X[i]+H.NX[i]*lat,z=H.Zc[i]+H.NZ[i]*lat,h=H.height(x,z)-H.Q.wl;
      if(h>0.15&&h<0.9)add("osier",x,z,0.6+0.4*r(),0.05,r()*6.283);}
    // 4) lit majeur : quelques frenes isoles et des bosquets rares au pied du talus (la plaine reste ouverte)
    for(let k=0,cnt=0;k<60&&cnt<6;k++){const x=(r()-0.5)*(T.X-40),z=H.zv(x)+(r()-0.5)*2*H.fw(x)*0.85;
      H.query(x,z);if(Math.abs(H.Q.lat)<H.HW[H.Q.i]+18)continue;add("frene",x,z,0.85+0.35*r(),0.02,r()*6.283);cnt++;}
    for(const side of [-1,1]){let x=-T.X/2+5;
      while(x<T.X/2-5){x+=9+r()*10;if(H.fbm(x*0.012+side*3,4.2)<0.58)continue;
        add(r()<0.6?"frene":"aulne",x,H.zv(x)+side*(H.fw(x)+2+r()*5),0.7+0.4*r(),0.03,r()*6.283);}}
    H.SH=SH;                                                                              // ombrage du lit, utilise plus tard (herbiers, temperature)
    const bkt=rvBarkTex(c),woodMat=new THREE.MeshStandardMaterial({map:bkt.map,bumpMap:bkt.bump,bumpScale:1.2,vertexColors:true,roughness:0.95,metalness:0});VEG.fade(woodMat,true,1,true);
    SPN.forEach((s,si)=>{
      if(!inst[s].length)return;
      const tx=VEG.leafTex(s),lm=new THREE.MeshStandardMaterial({map:tx,emissive:new THREE.Color(0.1,0.1,0.1),emissiveMap:tx,alphaTest:0.42,side:THREE.DoubleSide,roughness:0.75,metalness:0});
      VEG.sway(lm,0.18,14,0);VEG.fade(lm,true);
      const dm=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,map:tx,alphaTest:0.42});
      const tpl=[];for(let k=0;k<NTS[s];k++)tpl.push(VEG.tree(VEG.SP[s],H.seed*31+si*101+k*7,det));
      VEG.place(grp,tpl,inst[s],lm,dm,woodMat);
    });
    return grp;
  }
});

/* ----- Module : foret des versants (touffes de feuillage peu couteuses, avec clairieres) ----- */
defModule({id:"foret",nom:{fr:"Forêt des versants",en:"Hillside forest"},
  build(c){
    const H=c.HY,q=c.Q,T=c.CFG.terrain,r=VEG.rng(H.seed*13+5),det=q.key==="high"?1:0,P=[],N=[],C=[];
    for(let k=0;k<5;k++){                                   // une touffe = 5 boules deformees
      const g=new THREE.IcosahedronGeometry(1,det),p=g.attributes.position,ox=(r()-0.5)*1.1,oy=0.45+r()*0.9,oz=(r()-0.5)*1.1,sc=0.55+0.4*r();
      for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),d=1+0.25*(H.noise(x*2.1+k*5,y*2.1+z*1.7)-0.5),sh=0.55+0.45*(y*0.5+0.5);
        P.push(x*sc*d+ox,y*sc*d*0.85+oy,z*sc*d+oz);N.push(x,y,z);C.push(0.11*sh,0.17*sh,0.07*sh);}
      g.dispose();
    }
    const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(P,3));
    g.setAttribute("normal",new THREE.Float32BufferAttribute(N,3));g.setAttribute("color",new THREE.Float32BufferAttribute(C,3));
    const L=[],step=q.key==="low"?9:6.5;
    for(let x=-T.X/2+3;x<T.X/2;x+=step)for(const side of [-1,1])for(let k=0;k<14;k++){
      const d=H.fw(x)+c.CFG.valley.terraceW+3+k*step+r()*4,xx=x+(r()-0.5)*5,z=H.zv(xx)+side*d;
      if(d>T.Z/2-2)break;if(H.fbm(xx*0.012+side*7,z*0.012)<0.36)continue;
      L.push({x:xx,z,y:H.height(xx,z)-0.5,s:3.2+r()*2.6,t:r(),rot:r()*6.283});
    }
    const fm=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.9,metalness:0});VEG.fade(fm,true);const im=new THREE.InstancedMesh(g,fm,Math.max(1,L.length));
    const dm=new THREE.Object3D(),col=new THREE.Color();
    L.forEach((t,i)=>{dm.position.set(t.x,t.y,t.z);dm.rotation.set(0,t.rot,0);dm.scale.set(t.s,t.s*(1+0.4*t.t),t.s);dm.updateMatrix();im.setMatrixAt(i,dm.matrix);
      col.setRGB(0.8+0.5*t.t,0.85+0.35*r(),0.7+0.3*r());im.setColorAt(i,col);});
    im.count=L.length;im.castShadow=true;im.receiveShadow=true;return im;
  }
});

// Touffe = plans croises ; normales vers le haut pour un eclairage proche de celui du sol
VEG.cross=function(np){
  const P=[],N=[],Uv=[],I=[];
  for(let k=0;k<np;k++){const a=k*Math.PI/np,cx=Math.cos(a)*0.5,cz=Math.sin(a)*0.5,b=P.length/3;
    P.push(-cx,0,-cz,cx,0,cz,cx,1,cz,-cx,1,-cz);for(let j=0;j<4;j++)N.push(0,1,0);Uv.push(0,0,1,0,1,1,0,1);I.push(b,b+1,b+2,b,b+2,b+3);}
  const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(P,3));
  g.setAttribute("normal",new THREE.Float32BufferAttribute(N,3));g.setAttribute("uv",new THREE.Float32BufferAttribute(Uv,2));g.setIndex(I);return g;
};

/* ----- Module : herbes des berges, prairie, roseaux et laiches (helophytes) ----- */
defModule({id:"herbes",nom:{fr:"Herbes et roseaux",en:"Grasses and reeds"},
  build(c){
    const H=c.HY,q=c.Q,T=c.CFG.terrain,r=VEG.rng(H.seed*17+9),grp=new THREE.Group(),dm=new THREE.Object3D(),col=new THREE.Color(),ss=H.ss,sdd=H.seed%37;
    const k=q.key==="high"?1:q.key==="medium"?0.5:0.2,iA=H.idx(-T.X/2+3),iB=H.idx(T.X/2-3);
    const ucx=()=>{const q=H.Q,i=q.i;return !!(H.UC&&H.UC[i]>0.02&&q.lat*H.UCS[i]>0&&Math.abs(q.lat)-H.HW[i]<H.UCC[i]*H.UC[i]+0.8);};
    const dryF=(x,z)=>ss(0.52,0.7,H.fbm(x*0.018+sdd,z*0.018+3.7)),lushF=(x,z)=>H.fbm(x*0.05+5,z*0.05+sdd);       // plaques seches ; variations de vert
    const tint=(x,z,wet)=>{const d=dryF(x,z)*(1-wet),l=0.78+0.27*lushF(x,z),j=0.9+0.2*r();return [(0.95+0.45*d)*l*j,(0.95+0.05*d)*l*j,(0.8-0.35*d)*l*j];};
    function mesh(kind,list,planes,far,amp,cast,emi){
      const tx=VEG.grassTex(kind),m=new THREE.MeshStandardMaterial({map:tx,emissive:new THREE.Color(emi,emi,emi),emissiveMap:tx,alphaTest:0.4,side:THREE.DoubleSide,roughness:0.85,metalness:0});
      VEG.sway(m,amp,1,far);VEG.upN(m);VEG.fade(m,false,0.3);
      const im=new THREE.InstancedMesh(VEG.cross(planes),m,list.length);
      list.forEach((t,i)=>{dm.position.set(t.x,t.y,t.z);dm.rotation.set(0,t.rot,0);dm.scale.set(t.w,t.h,t.w);dm.updateMatrix();im.setMatrixAt(i,dm.matrix);
        col.setRGB(t.c[0],t.c[1],t.c[2]);im.setColorAt(i,col);});
      im.receiveShadow=true;im.castShadow=!!cast;
      if(cast)im.customDepthMaterial=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,map:tx,alphaTest:0.4});
      grp.add(im);
    }
    const G1=[],G2=[],G3=[],G4=[],G5=[];
    // 1) hautes herbes des berges : denses pres de l'eau, plus rares en s'eloignant (jamais seches pres de l'eau)
    for(let n=0,N1=Math.round(22000*k);n<N1;n++){
      const i=iA+Math.floor(r()*(iB-iA)),side=r()<0.5?-1:1,e=0.15+Math.pow(r(),1.7)*14,lat=side*(H.HW[i]+e);
      const x=H.X[i]+H.NX[i]*lat+(r()-0.5)*0.5,z=H.Zc[i]+H.NZ[i]*lat+(r()-0.5)*0.5,y=H.height(x,z);
      if(y<H.Q.wl+0.05||H.Q.isl>0.5||ucx())continue;
      const hh=(0.45+0.5*r())*(1.25-0.5*Math.min(1,e/14))*0.6;   /* herbes de berge 0,25-0,85 m */
      G1.push({x,y:y-0.03,z,rot:r()*6.283,w:hh*(0.9+0.4*r()),h:hh,c:tint(x,z,1-Math.min(1,e/10))});
    }
    // 2) prairie : plus de touffes (3 plans), plaques seches, variations de vert ; fleurs en taches
    for(let n=0,N2=Math.round(22000*k);n<N2;n++){
      const x=(r()-0.5)*(T.X-6),z=H.zv(x)+(r()-0.5)*2*H.fw(x)*0.95,y=H.height(x,z);
      if(y<H.Q.wl+0.08||ucx())continue;const dq=Math.max(0,Math.abs(H.Q.lat)-H.HW[H.Q.i]);if(r()>0.2+0.8*(1-ss(8,60,dq)))continue;const hh=(0.2+0.3*r())*0.75;
      G2.push({x,y:y-0.02,z,rot:r()*6.283,w:hh*1.35,h:hh,c:tint(x,z,0)});
      if(r()<0.3&&H.fbm(x*0.035+sdd*2,z*0.035+11)>0.56){const fh=0.22+0.25*r();G5.push({x:x+(r()-0.5)*0.3,y:y-0.02,z:z+(r()-0.5)*0.3,rot:r()*6.283,w:fh*1.1,h:fh,c:[0.9+0.2*r(),0.9+0.2*r(),0.9+0.2*r()]});}
    }
    // 3) helophytes en massifs : roseaux et laiches en bordure, surtout cote interieur des courbes
    H.RS=new Float32Array(H.N);for(let n=0,N3=Math.round(6000*k);n<N3;n++){

/* ----- Module : homme de 1,80 m pour l'echelle. A retirer plus tard : decocher la case "Couches"
   ou supprimer ce module (defModule id "echelle"). ----- */
defModule({id:"echelle",nom:{fr:"Échelle : homme de 1,80 m",en:"Scale: 1.80 m person"},
  build(c){
    const H=c.HY,grp=new THREE.Group();grp.name="echelle";
    const lo=H.idx(-130),hi=H.idx(130);let ip=lo;
    for(let i=lo;i<=hi;i++)if(H.P[i]*H.D[i]>H.P[ip]*H.D[ip])ip=i;      // la mouille la plus creuse (celle de l'etiquette "Mouille")
    const sg=Math.sign(H.VP[ip])||1,p={x:0,y:0,z:0},p0={x:0,y:0,z:0};
    H.pointAt(ip,-sg*H.HW[ip]*0.9,p);H.pointAt(ip,0,p0);               // pied : bord de la rive interieure (convexe)
    const gy=H.height(p.x,p.z);
    const M=(hex,r)=>new THREE.MeshStandardMaterial({color:c.lin(hex),roughness:r||0.85,metalness:0});
    const wad=M(0x4e5b3a),jac=M(0xd9732a),skin=M(0xd9b08c),boot=M(0x262626);
    const add=(geo,mat,x,y,z)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;grp.add(m);return m;};
    for(const k of [-1,1]){
      add(new THREE.CylinderGeometry(0.075,0.065,0.88,10),wad,k*0.10,0.44,0);      // jambes (waders) 0 -> 0,88 m
      add(new THREE.CylinderGeometry(0.07,0.075,0.12,10),boot,k*0.10,0.06,0.02);   // bottes
      add(new THREE.CylinderGeometry(0.045,0.04,0.58,8),jac,k*0.26,1.17,0);        // bras 0,88 -> 1,46 m
      add(new THREE.SphereGeometry(0.05,8,6),skin,k*0.26,0.86,0);                  // mains
    }
    add(new THREE.BoxGeometry(0.40,0.60,0.24),jac,0,1.18,0);                       // torse 0,88 -> 1,48 m
    add(new THREE.CylinderGeometry(0.05,0.05,0.08,8),skin,0,1.52,0);               // cou
    add(new THREE.SphereGeometry(0.11,12,10),skin,0,1.69,0);                       // tete : sommet a 1,80 m
    grp.position.set(p.x,gy,p.z);
    grp.rotation.y=Math.atan2(p0.x-p.x,p0.z-p.z);                                   // face a la riviere
    return grp;
  }
});
/* ----- Module : herbiers aquatiques. Renoncules (tiges souples qui ondulent dans le courant) dans les radiers et

   Seuils = ordres de grandeur du modele (voir Sources_Riviere.txt, section E). ----- */
defModule({id:"herbiers",nom:{fr:"Herbiers aquatiques (renoncules, mousses)",en:"Aquatic beds (water-crowfoot, mosses)"},
  build(c){
    const H=c.HY,q=c.Q,r=VEG.rng(H.seed*19+11),grp=new THREE.Group(),ds=H.ds,p={x:0,y:0,z:0};
    const k=q.key==="high"?1:q.key==="medium"?0.6:0.3,ss=H.ss,SH=H.SH||new Float32Array(H.N);   // SH : ombrage du lit (module ripisylve)
    const iA=H.idx(-290),iB=H.idx(290),st=Math.max(1,Math.round(0.8/ds));
    const CRW=H.CRW||[],G=new Map();                  /* houppiers ranges par cases de 8 m */
    CRW.forEach(t=>{for(let gx=Math.floor((t.x-t.rc)/8);gx<=Math.floor((t.x+t.rc)/8);gx++)for(let gz=Math.floor((t.z-t.rc)/8);gz<=Math.floor((t.z+t.rc)/8);gz++){const kk=gx*10007+gz;(G.get(kk)||G.set(kk,[]).get(kk)).push(t);}});

    // 1) renoncules : cases de 1 m x 0,8 m ; probabilite = courant (peu de mouille) x profondeur (optimum ~35 cm) x lumiere x taches allongees dans le sens du courant
    const R1=[];H.HB=new Float32Array(H.N);let best=null,bestN=0;
    for(let i=iA;i<iB;i+=st){
      const w=1-ss(0.35,0.7,H.P[i]),sun=Math.pow(1-ss(0.12,0.45,SH[i]),1.5);   // renoncules : aucune dans une section ombragee (SH > 0,45)
      if(w<0.05||sun<0.05)continue;
      const dirx=H.NZ[i],dirz=-H.NX[i],yaw=Math.atan2(H.NX[i],H.NZ[i]);
      for(let lat=-H.HW[i]*0.9;lat<=H.HW[i]*0.9;lat+=0.8){
        H.pointAt(i,lat,p);const y=H.height(p.x,p.z);
        if(H.Q.zone!==0||H.Q.isl>0.3)continue;
        const dd=H.WL[i]-y,wd=Math.max(0,1-Math.abs(dd-0.35)/0.5);if(wd<=0)continue;
        const patch=ss(0.50,0.62,H.fbm(H.S[i]/8+(H.seed%31),lat/2.2+(H.seed%17)*0.7));
        const n=Math.floor(patch*w*sun*wd*(1-ss(0.05,0.35,crown(p.x,p.z)))*4.6*k*RVHB.mult+r());
        for(let j=0;j<n;j++){

          if(H.Q.zone!==0||H.WL[i]-yy<0.06||crown(x,z)>0.35)continue;

        }

        for(let n=0;n<16;n++){                         // tiges legerement courbees, feuilles finement divisees de chaque cote
          const x0=64+(r2()-0.5)*40,sw=(r2()-0.5)*70,len=170+r2()*80,col=[58+r2()*30,104+r2()*34,50+r2()*24],pts=[];
          g.strokeStyle="rgb("+col.map(Math.round).join(",")+")";g.lineWidth=2.2;g.beginPath();g.moveTo(x0,256);
          for(let s=1;s<=12;s++){const t=s/12,nx=x0+sw*t*t+Math.sin(t*5+n)*5*t,ny=256-len*t;g.lineTo(nx,ny);pts.push([nx,ny,t]);}
          g.stroke();g.lineWidth=1;
          for(const a of pts)for(const sd of [-1,1]){const l=10+16*(1-a[2]*0.5)*r2();g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(a[0]+sd*l,a[1]-4-r2()*8);g.stroke();}

      const SEG=6,NP=3,pos=[],uv=[],nor=[],ind=[];       // 3 plans croises, 6 segments en hauteur (la tige se courbe dans le shader)

      const geo=new THREE.BufferGeometry();

`#include <begin_vertex>
float rvT=transformed.y;

#endif
rvPh+=uTime*2.1+rvT*4.0;
transformed.x+=aLean*rvT*rvT*0.95+(0.10+0.08*aLean)*rvT*sin(rvPh);
transformed.y*=1.0-0.18*aLean*rvT;`);
      };
      VEG.upN(m);const im=new THREE.InstancedMesh(geo,m,R1.length),dm=new THREE.Object3D(),col=new THREE.Color();
      R1.forEach((t,i)=>{dm.position.set(t.x,t.y,t.z);dm.rotation.set(0,t.yaw,0);dm.scale.setScalar(t.len);dm.updateMatrix();im.setMatrixAt(i,dm.matrix);
        lean[i]=t.lean;col.setRGB(t.g,t.g,t.g*0.95);im.setColorAt(i,col);});
      im.receiveShadow=true;grp.add(im);
    }
    // 2) mousses (Fontinalis) : touffes irregulieres posees sur la VRAIE surface des blocs, a la ligne d'eau (DECOR1)
    {const M1=[],dm=new THREE.Object3D(),mt=new THREE.Matrix4(),nm=new THREE.Matrix3(),pv=new THREE.Vector3(),nv=new THREE.Vector3(),UPV=new THREE.Vector3(0,1,0),qs=new THREE.Quaternion(),qr=new THREE.Quaternion();
     for(const rk of H.ROCKS){
       if(!rk.inCh||Math.abs(rk.x)>290||rk.r<0.1)continue;
       const rg=H.RGEO&&H.RGEO[rk.v+"_"+rk.cls];if(!rg)continue;
       const i=H.query(rk.x,rk.z).i;if(H.P[i]>0.4||rk.top<rk.wl-0.4||r()>(0.3+0.6*ss(0.15,0.6,SH[i]))*Math.min(1,k*1.3))continue;   // mousses : surtout a l'ombre
       dm.position.set(rk.x,rk.y,rk.z);dm.rotation.set(rk.tilt,rk.rot,rk.tilt*0.5);dm.scale.set(rk.r,rk.r,rk.r);dm.updateMatrix();mt.copy(dm.matrix);nm.getNormalMatrix(mt);
       const P=rg.attributes.position,N=rg.attributes.normal,want=1+Math.floor(r()*(rk.r>0.3?6:3))/* DECOR4 */;let got=0;
       for(let tr=0;tr<60&&got<want;tr++){const vi=Math.floor(r()*P.count);
         pv.set(P.getX(vi),P.getY(vi),P.getZ(vi)).applyMatrix4(mt);nv.set(N.getX(vi),N.getY(vi),N.getZ(vi)).applyMatrix3(nm).normalize();
         if(pv.y<rk.wl-0.12||pv.y>rk.wl+0.08||nv.y<0.15)continue;   // sur la surface, a la ligne d'eau, jamais sous le bloc
         M1.push({x:pv.x+nv.x*0.006,y:pv.y+nv.y*0.006,z:pv.z+nv.z*0.006,nx:nv.x,ny:nv.y,nz:nv.z,s:rk.r*(0.26+0.16*r()),rot:r()*6.283,g:0.75+0.45*r()});got++;}
     }
     if(M1.length){
       const rg2=VEG.rng(991),NB=11,parts=[];let nvv=0;                      // une touffe = 7 masses irregulieres (1 centrale + 6 autour), base aplatie
       for(let b=0;b<NB;b++){const pp=new THREE.IcosahedronGeometry(1,2).attributes.position;nvv=pp.count;
         const ang=rg2()*6.283,rad=b?0.12+0.36*rg2():0,sx=0.14+0.2*rg2();
         parts.push({pp:pp,ox:Math.cos(ang)*rad,oz:Math.sin(ang)*rad,sx:sx,sy:sx*(0.12+0.10*rg2()),sz:sx*(0.8+0.4*rg2()),ph:rg2()*6.3,tn:0.68+0.5*rg2()});}

         cpos[q]=x+o.ox;cpos[q+1]=y;cpos[q+2]=z+o.oz;ccol[q]=sh*(0.7+0.32*hf);ccol[q+1]=sh;ccol[q+2]=sh*(0.62-0.2*hf);}});

/* ===== BLOC GRANULO ===== */
/* Granulometrie du lit : modele de competence (Shields) a un debit "formateur".
   Tout est un ORDRE DE GRANDEUR DU MODELE, pas une mesure. Classes : Wentworth (verifie). */
const GRN={
  uref:0.5,        // vitesse moyenne mediane du troncon a l'etiage (m/s) : fixe le debit du modele [M]
  F:3.6,           // rapport vitesse du debit formateur / vitesse courante [M]
  Cf:0.003,        // coefficient de frottement [M]
  theta:0.045,     // parametre de Shields critique [M]
  M:21,umax:2.2,   // echantillons lateraux par section ; vitesse maximale (m/s)
  fade:[0.02,0.12],// fondu de couleur vers le terrain de base pres de la ligne d'eau (m)
  /* [D50 en mm, couleur] : fines, sable, gravier fin, gravier grossier, galets */
  stops:[[0.15,0x544b3a],[0.7,0xc9b883],[6,0xb38a4c],[30,0x7d7361],[130,0x4d5052]]
};
function rvGranulo(H){
  const N=H.N,M=GRN.M,S53=new Float32Array(N),A=new Float32Array(N);
  const i0=Math.max(0,H.idx(-310)),i1=Math.min(N-1,H.idx(310)),as=[];
  for(let i=i0;i<=i1;i+=2){
    const hw=H.HW[i]*1.05,dl=2*hw/M;let a=0,s=0;
    for(let k=0;k<M;k++){
      const l=-hw+2*hw*(k+0.5)/M,d=H.WL[i]-H.height(H.X[i]+H.NX[i]*l,H.Zc[i]+H.NZ[i]*l);
      if(d>0.02){a+=d*dl;s+=Math.pow(d,5/3)*dl;}
    }
    A[i]=a;S53[i]=s;if(i+1<N){A[i+1]=a;S53[i+1]=s;}
    if(a>0.05)as.push(a);
  }
  as.sort((p,q)=>p-q);
  const Qd=GRN.uref*(as.length?as[as.length>>1]:1);                         // debit du modele (m3/s)
  const kD=1e6*GRN.Cf*GRN.F*GRN.F/(GRN.theta*1650*9.81);                   // D50 (mm) = kD * u^2
  const vel=(i,d)=>{const s=S53[i];if(!(s>0)||d<=0)return 0;
    const pent=1.15-0.5*H.P[i];                                             // pente locale : forte sur radier, faible en mouille [M]
    return Math.min(GRN.umax,Qd*Math.pow(d,2/3)/s*pent);};
  const d50=(i,d,nz)=>{const u=vel(i,d);return kD*u*u*(nz||1);};
  const cls=D=>D<2?0:D<16?1:D<64?2:3;                                       // 0 sable, 1 gravier fin, 2 gravier grossier, 3 galets
  return {Qd,kD,vel,d50,cls,S53,A,i0,i1};
}
defModule({id:"granulo",nom:{fr:"Granulométrie du lit (sable → galets)",en:"Bed grain size (sand → cobbles)"},
  build(c){
    const H=c.HY,tm=c.scene.getObjectByName("terrain"),grp=new THREE.Group();
    const geo=tm&&tm.geometry,pos=geo&&geo.attributes.position,wd=geo&&geo.attributes.aWDepth,cb=geo&&geo.attributes.color;
    if(!pos||!wd||!cb){console.warn("[granulo] terrain introuvable ou sans attributs.");return null;}
    const G=rvGranulo(H);H.GR=G;
    const stops=GRN.stops.map(s=>({d:Math.log10(s[0]),c:c.linA(s[1])}));
    const out=new Float32Array(cb.array),ss=H.ss,n=pos.count,pa=pos.array,wa=wd.array,ca=cb.array;
    let nb=0;
    const LD=new Float32Array(n).fill(NaN);                                 // log10 du grain (mm) par sommet sous l'eau
    for(let v=0;v<n;v++){
      const d=wa[v];if(d<=GRN.fade[0])continue;
      const x=pa[v*3],z=pa[v*3+2];H.query(x,z);const i=H.Q.i;
      if(!(G.S53[i]>0))continue;
      LD[v]=Math.log10(Math.max(G.d50(i,d,Math.exp(2*(H.fbm(x*0.45,z*0.45)-0.5))),1e-3));
    }
    /* Lissage : le bruit du grain (periode ~2 m) est echantillonne tous les 0,6-0,7 m, ce qui fait des taches en "pixels".
       On moyenne le grain sur les sommets voisins (grille du terrain : colonnes de nzc sommets). */
    const SM=8;let nzc=1;while(nzc<n&&pa[nzc*3]===pa[0])nzc++;
    for(let it=0;it<SM;it++){
      const T=LD.slice();
      for(let v=0;v<n;v++){
        if(LD[v]!==LD[v])continue;
        const cj=v%nzc,ci=Math.floor(v/nzc);let s=LD[v]*2,w=2;
        for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){
          if(!di&&!dj)continue;const jj=cj+dj,u=(ci+di)*nzc+jj;
          if(jj<0||jj>=nzc||u<0||u>=n||LD[u]!==LD[u])continue;s+=LD[u];w++;}
        T[v]=s/w;
      }
      LD.set(T);
    }
    for(let v=0;v<n;v++){
      if(LD[v]!==LD[v])continue;
      const d=wa[v],x=pa[v*3],z=pa[v*3+2],L=LD[v];let a=stops[0],b=stops[0],t=0;
      if(L>=stops[stops.length-1].d){a=b=stops[stops.length-1];}
      else if(L>stops[0].d){for(let k=0;k<stops.length-1;k++){if(L<=stops[k+1].d){a=stops[k];b=stops[k+1];t=ss(0,1,(L-a.d)/(b.d-a.d));break;}}}
      const kk=0.94+0.12*H.noise(x*0.35,z*0.35),f=ss(GRN.fade[0],GRN.fade[1],d);   // ton : bruit lent (plus de repliement a 0,7 m)
      for(let q=0;q<3;q++)out[v*3+q]=ca[v*3+q]*(1-f)+(a.c[q]+(b.c[q]-a.c[q])*t)*kk*f;

/* Carte de chaleur des frayeres potentielles de la truite : score 0..1 = profondeur x courant x grain x position.

const FRY={
  sec:25,          // longueur d'un troncon de bilan (m) : base de la capacite d'accueil du jeu (phase C)
  thr:0.5,         // score a partir duquel une cellule compte comme "frayere potentielle" [M]
  dP:12,           // decalage (indices, 0,5 m) pour reperer la queue de mouille / tete de radier [M]
  dy:0.012         // hauteur de la carte au-dessus de la ligne d'eau (m)

function rvFray(H,G,M,step){
  const N=H.N,ss=H.ss,iA=Math.max(0,H.idx(-300)),iB=Math.min(N-1,H.idx(300)),nr=Math.floor((iB-iA)/step)+1;
  const pos=new Float32Array(nr*M*3),S=new Float32Array(nr*M),secs=new Map();let tot=0,wet=0,v=0;
  for(let r=0;r<nr;r++){
    const i=iA+r*step,hw=H.HW[i]*1.05,dl=2*hw/(M-1),ar=dl*H.ds*step;
    const pu=H.P[Math.max(0,i-FRY.dP)],pd=H.P[Math.min(N-1,i+FRY.dP)];
    const pp=0.25+0.75*ss(0.1,0.5,pu-pd);                                   // mouille en amont, radier en aval = queue de mouille [M]
    const sk=Math.floor(H.S[i]/FRY.sec);let sc=secs.get(sk);
    if(!sc){sc={area:0,wet:0,sx:0,sz:0,sw:0};secs.set(sk,sc);}

      const l=-hw+dl*q,x=H.X[i]+H.NX[i]*l,z=H.Zc[i]+H.NZ[i]*l,d=H.WL[i]-H.height(x,z);
      pos[v*3]=x;pos[v*3+1]=H.WL[i]+FRY.dy;pos[v*3+2]=z;
      if(d<=0.03)continue;
      const u=G.vel(i,d),D=G.d50(i,d,Math.exp(2*(H.fbm(x*0.45,z*0.45)-0.5)));  // meme grain que la couche Granulometrie

      const sv=ss(0.03,0.10,u)*(1-ss(0.6,0.85,u));/* A2c : bord bas abaisse (sites abrites < 20 cm/s) */                          // courant : environ 10 a 70 cm/s
      const sg=ss(2,8,D)*(1-ss(40,70,D));/* A2c : gravier ~1-5 cm */                                   // gravier : environ 2 a 50 mm

function rvSpWalk(o,f,chem){                     // parcourt l'arbre et appelle f(parametre, chemin) pour chaque {v,s}

  if("v" in o&&"s" in o&&typeof o.s==="string"){f(o,chem);return;}
  for(const k in o)rvSpWalk(o[k],f,chem+"."+k);

function rvSpStats(){                            // compte les parametres par statut et signale les anomalies dans la console

  rvSpWalk(RVSP.sp,(p,ch)=>{if(c[p.s]===undefined)bad.push(ch);else c[p.s]++;if(p.s!=="V"&&!p.r&&!/\.(prof|vit|abri)$/.test(ch)&&p.r==="")bad.push(ch+" (sans source)");},"sp");
  rvSpWalk(RVSP.inter,(p,ch)=>{if(c[p.s]===undefined)bad.push(ch);else c[p.s]++;},"inter");
  if(bad.length)console.warn("[especes] parametres a verifier :",bad.join(", "));
  return c;
}

  m:{fr:"Le modèle suit les portions déversées à part des poissons sauvages. Elles agissent sur la truite fario de deux façons, toutes deux des hypothèses du modèle : elles détournent une partie de la pêche (avec un nombre de pêcheurs inchangé, choix de l'auteur) et elles concurrencent faiblement les juvéniles de truite fario. Dans le modèle, l'effet est positif sous forte pression de pêche et quasi nul sans pêche, car les portions disparaissent en quelques semaines. Ce résultat n'est pas démontré : les études disponibles sont partagées. Limite létale d'environ 24 °C (une étude) et seuil de stress de 20 °C (ordre de grandeur).",

/* MILIEU DU MOTEUR DE POPULATION. Calcul PUR : rien dans l'eau, aucun affichage.
   Contenu : saisons (4 pas par an), debit saisonnier relatif a l'etiage, temperature par troncon, habitat par troncon et par debit
   (profondeur et vitesse recalculees pour chaque debit, surface utile ponderee par stade d'apres RVSP).
   TOUT ce qui suit est un ORDRE DE GRANDEUR DU MODELE [M], sauf la loi d'ecoulement (Manning : Q proportionnel a somme(d^5/3), vitesse ~ d^2/3).
   Console : RVENV.build() puis RVENV.resume(). Pour changer une valeur : modifier RVENG ci-dessous. */
window.RVCTX={off:0,key:"pied"};   // CONTEXTE1 : decalage de temperature de base (bloc CONTEXTE1)
const RVENG={
  saisons:["printemps","ete","automne","hiver"],   // annee du modele : de l'emergence (printemps) a la ponte (hiver)
  tronc:25,                  // longueur d'un troncon (m)
  secPas:5,                  // une section de calcul tous les 5 m dans un troncon
  M:25,                      // points lateraux par section
  xMax:300,                  // demi-longueur etudiee (m), comme Granulometrie et Frayeres
  largeurLat:1.6,            // zone explorée = 1,6 x la demi-largeur du lit (l'eau peut deborder un peu en hautes eaux)
  qGrille:[0.35,0.5,0.7,1,1.4,2,3,4.5],   // debits calcules, relatifs a l'etiage (1 = debit du modele de Granulometrie)
  qMin:0.35,qMax:4.5,
  debit:{printemps:{m:2.2,sd:0.35},ete:{m:1.0,sd:0.40},automne:{m:1.6,sd:0.50},hiver:{m:3.0,sd:0.45}},   // mediane relative a l'etiage ; ecart type du log [M]
  corrAn:0.6,                // part commune (annee humide ou seche) a toutes les saisons [M]
  crue:{printemps:0.15,automne:0.20,hiver:0.25},   // probabilite annuelle d'une crue forte, par saison [M]
  temp:{                     // temperature moyenne de saison d'un troncon TOTALEMENT ombrage, puis ajouts [M] (a caler sur des releves)
    base:{printemps:8.5,ete:14.5,automne:9.5,hiver:4.5},
    soleil:{printemps:1.5,ete:1.5,automne:0.5,hiver:0},
    picSoleil:{printemps:0,ete:0.9,automne:0,hiver:0},        // pointe supplementaire d'un tronçon sans ombre (moyenne journaliere de la semaine chaude : nord-sud observe 2,4 = 1,5 + 0,9, Sources P10)   // + ce nombre x (1 - ombre) : l'absence d'ombre rechauffe (ordre de grandeur : Sources D5)
    pic:{printemps:2,ete:2.0,automne:2,hiver:1.5},         // pointe d'une semaine chaude au-dessus de la moyenne
    kq:{printemps:0.5,ete:2.0,automne:0.5,hiver:0.3}},     // effet du debit : (1 - q) x kq, borne entre -0,4 et +0,65
  ombreRef:0.6,              // indice d'ombrage (H.SH) a partir duquel le troncon est "totalement ombrage"
  ombreDef:0.3,              // valeur de repli si la ripisylve n'est pas construite
  couvBase:0.4               // couverture d'un lit sans bois mort (0..1) : blocs, profondeur [M]
};
function rvRng(seed){let a=(seed>>>0)||1;const f=function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};
  f.g=function(){let u=0;while(u===0)u=f();return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185307*f());};return f;}
function rvSS(a,b,x){if(!(b>a))return x>=b?1:0;let u=(x-a)/(b-a);u=u<0?0:u>1?1:u;return u*u*(3-2*u);}
function rvTrap(x,t){if(x<t[0]||x>=t[3])return 0;if(x<t[1])return (x-t[0])/(t[1]-t[0]);if(x<=t[2])return 1;return (t[3]-x)/(t[3]-t[2]);}   // 0 avant a, 1 de b a c, 0 apres d
function rvSuit(h,d,u,D,cov,colm){                  // qualite 0..1 d'un point pour un stade (h = RVSP.sp.xxx.hab.stade)
  let s=rvTrap(d,h.prof.v);if(s<=0)return 0;
  if(h.vit)s*=rvTrap(u,h.vit.v);
  if(h.d50)s*=rvTrap(D,h.d50.v);
  if(h.abri)s*=1-h.abri.v*(1-cov);                  // importance de l'abri x manque de couverture
  if(h.colmatage)s*=1-h.colmatage.v*colm;           // colmatage du troncon (0 pour l'instant : sera alimente par les pressions)
  return s;}
function rvEnvBuild(H,opt){
  const E=RVENG,t0=Date.now();opt=opt||{};
  if(!H||!H.height){console.warn("[env] riviere introuvable.");return null;}
  const G=(H.GR&&H.GR.vel)?H.GR:rvGranulo(H);
  H.ABRI=rvAbri(H);if(!H.SH)console.warn("[env] ombrage (ripisylve) absent : valeur de repli "+E.ombreDef+".");
  const ds=H.ds,L=E.tronc,per=Math.round(L/ds),iA=Math.max(G.i0,H.idx(-E.xMax)),iB=Math.min(G.i1-1,H.idx(E.xMax));
  const nr=Math.floor((iB-iA)/per),nq=E.qGrille.length,M=E.M,nsec=Math.max(1,Math.round(L/E.secPas)),secL=L/nsec,bank=CFG.reach.bankH*0.9;
  if(nr<2){console.warn("[env] troncon trop court.");return null;}
  const sps=[];for(const k in RVSP.sp){const sp=RVSP.sp[k];if(sp.stades&&sp.hab)sps.push(sp);}
  const wua={};sps.forEach(sp=>{wua[sp.id]={};sp.stades.forEach(st=>{wua[sp.id][st]=new Float32Array(nq*nr);});});
  const wet=new Float32Array(nq*nr),dm=new Float32Array(nq*nr),vm=new Float32Array(nq*nr),reaches=[];
  for(let r=0;r<nr;r++){
    const i0=iA+r*per,i1=i0+per;let so=0,bm=0,po=0;
    for(let i=i0;i<i1;i++){so+=H.SH?H.SH[i]:E.ombreDef;bm+=H.ABRI?H.ABRI[i]:(H.BM?H.BM[i]:0);po+=H.P[i];}
    const rc={r:r,i0:i0,i1:i1,s:H.S[i0],len:L,ombre:Math.min(1,(so/per)/E.ombreRef),bm:bm/per,pool:po/per,colm:0,deep:0};reaches.push(rc);
    const secs=[];
    for(let k=0;k<nsec;k++){
      const i=Math.min(G.i1-1,i0+Math.round((k+0.5)*per/nsec)),hw=H.HW[i]*E.largeurLat,dl=2*hw/M,d0=new Float32Array(M),nz=new Float32Array(M);let F0=0,mx=0,nDeep=0;
      for(let c=0;c<M;c++){const l=-hw+dl*(c+0.5),x=H.X[i]+H.NX[i]*l,z=H.Zc[i]+H.NZ[i]*l;
        d0[c]=H.WL[i]-H.height(x,z);nz[c]=Math.exp(2*(H.fbm(x*0.45,z*0.45)-0.5));
        if(d0[c]>0.02)F0+=Math.pow(d0[c],5/3)*dl;if(d0[c]>mx)mx=d0[c];if(d0[c]>RVSURV.deepD)nDeep++;}
      const dr=new Float32Array(M);   // profondeur de reference pour le grain : celle de la cellule mouillee la plus proche a l'etiage (une berge inondee garde le grain du lit voisin, pas du sable) [M]
      for(let c=0;c<M;c++){if(d0[c]>0.05){dr[c]=d0[c];continue;}let b=0.05;for(let k=1;k<M;k++){if(c-k>=0&&d0[c-k]>0.05){b=d0[c-k];break;}if(c+k<M&&d0[c+k]>0.05){b=d0[c+k];break;}}dr[c]=b;}
      rc.deep=(rc.deep||0)+nDeep/M/nsec;secs.push({i:i,dl:dl,d0:d0,dr:dr,nz:nz,F0:F0,mx:mx,cov:E.couvBase+(1-E.couvBase)*Math.min(1,H.ABRI?H.ABRI[i]:(H.BM?H.BM[i]:0))});
    }
    for(let qi=0;qi<nq;qi++){
      const q=E.qGrille[qi];let wA=0,dS=0,vS=0;const acc={};
      sps.forEach(sp=>{acc[sp.id]={};sp.stades.forEach(st=>{acc[sp.id][st]=0;});});
      for(const sc of secs){
        if(!(sc.F0>0))continue;
        const fl=dh=>{let s=0;for(let c=0;c<M;c++){const d=sc.d0[c]+dh;if(d>0.02)s+=Math.pow(d,5/3)*sc.dl;}return s;};   // Manning : le debit varie comme somme(d^5/3)
        const tg=q*sc.F0;let dh;
        if(fl(bank)<=tg)dh=bank;else{let lo=-sc.mx,hi=bank;for(let it=0;it<28;it++){const mid=0.5*(lo+hi);if(fl(mid)<tg)lo=mid;else hi=mid;}dh=0.5*(lo+hi);}
        for(let c=0;c<M;c++){
          const d=sc.d0[c]+dh;if(d<=0.02)continue;
          const u=G.vel(sc.i,d),D=G.d50(sc.i,sc.dr[c],sc.nz[c]),a=sc.dl*secL;   // grain = celui du fond a l'etiage (ne change pas avec le debit)
          wA+=a;dS+=d*a;vS+=u*a;
          sps.forEach(sp=>{sp.stades.forEach(st=>{const h=sp.hab[st];if(h)acc[sp.id][st]+=rvSuit(h,d,u,D,sc.cov,rc.colm)*a;});});
        }
      }
      const o=qi*nr+r;wet[o]=wA;dm[o]=wA>0?dS/wA:0;vm[o]=wA>0?vS/wA:0;
      sps.forEach(sp=>{sp.stades.forEach(st=>{wua[sp.id][st][o]=acc[sp.id][st];});});
    }
  }
  const lq=E.qGrille.map(Math.log);
  const env={H:H,nr:nr,reaches:reaches,qg:E.qGrille,wua:wua,wet:wet,dm:dm,vm:vm,sps:sps.map(s=>s.id),ms:Date.now()-t0,
    pos(q){q=Math.max(E.qGrille[0],Math.min(E.qGrille[nq-1],q));let j=0;while(j<nq-2&&q>=E.qGrille[j+1])j++;return {j:j,t:(Math.log(q)-lq[j])/(lq[j+1]-lq[j])};},
    lerp(arr,r,q){const p=this.pos(q);return arr[p.j*nr+r]*(1-p.t)+arr[(p.j+1)*nr+r]*p.t;},
    get(sp,st,r,q){return this.lerp(this.wua[sp][st],r,q);},          // surface utile ponderee (m2) d'un stade dans un troncon a un debit relatif q
    area(r,q){return this.lerp(this.wet,r,q);},
    temp(r,sa,q,dT){const T=E.temp,qq=Math.max(-0.4,Math.min(0.65,1-q)),m=T.base[sa]+T.soleil[sa]*(1-this.reaches[r].ombre)+T.kq[sa]*qq+(dT||0)+RVCTX.off+(this.reaches[r].dTp||0);return {mean:m,pic:m+T.pic[sa]+(T.picSoleil?T.picSoleil[sa]:0)*(1-this.reaches[r].ombre)};},
    annee(rng){                                                        // tire un regime hydrologique : debits des 4 saisons et crues
      const z=rng.g(),q={},cr={},c=E.corrAn,s2=Math.sqrt(1-c*c);
      E.saisons.forEach(sa=>{const d=E.debit[sa],zz=c*z+s2*rng.g();q[sa]=Math.max(E.qMin,Math.min(E.qMax,d.m*Math.exp(d.sd*zz-0.5*d.sd*d.sd)));
        cr[sa]=(E.crue[sa]&&rng()<E.crue[sa])?0.3+0.7*rng():0;});

}
window.RVENV={build(){const e=rvEnvBuild(typeof HY!=="undefined"?HY:null);this.env=e;if(e)console.info("[env] "+e.nr+" troncons de "+RVENG.tronc+" m, calcule en "+e.ms+" ms.");return e;},
  resume(env){env=env||this.env;if(!env){console.warn("[env] faire RVENV.build() d'abord.");return;}
    const rows=[];RVENG.saisons.forEach(sa=>{const q=RVENG.debit[sa].m;let w=0,dd=0,vv=0,tp=0,tm=0;
      for(let r=0;r<env.nr;r++){w+=env.area(r,q);dd+=env.lerp(env.dm,r,q);vv+=env.lerp(env.vm,r,q);const T=env.temp(r,sa,q,0);tm+=T.mean;tp+=T.pic;}
      const row={saison:sa,q_etiage:q,surface_mouillee_m2:Math.round(w),prof_moy_cm:Math.round(100*dd/env.nr),vit_moy_cm_s:Math.round(100*vv/env.nr),T_moy:+(tm/env.nr).toFixed(1),T_pic:+(tp/env.nr).toFixed(1)};
      if(env.wua.fario){["oeuf","j0","j1","ad"].forEach(st=>{let s=0;for(let r=0;r<env.nr;r++)s+=env.get("fario",st,r,q);row["fario_"+st+"_%"]=w>0?+(100*s/w).toFixed(1):0;});}

/* PECHE ET DEVERSEMENT DE TRUITES "PORTION" (fario sauvage). Calcul PUR, rien dans l'eau ; TOUT est desactive par defaut (RVHAL.on).
   Sans peche ni deversement (RVHAL.on.peche = RVHAL.on.devers = false) les resultats sont ceux du moteur seul.
   PECHE : chaque annee, une part h des poissons CAPTURABLES est prelevee pendant la saison (2e samedi de mars au 3e dimanche de septembre), donc AVANT la ponte d'hiver.
   Capturables = part fL des adultes (2 ans et plus) ; les 0+ et 1+ ne sont pas touches. h = 0,65 : ordre de grandeur [O] (Brevenne, Rhone : 60-65 % des truites adultes
   conservees par an avant la fenetre de capture). fL = 0,5 : choix du modele [M], NON SOURCE.

  on:{peche:false,devers:false},
  peche:{h:0.65,fL:0.5},
  devers:{nKm:30,prise:0.9,survHiver:0.3,espece:"arc",conc:true,detourne:true,q:1,attrait:0,k:null,partEff:0.5,sejourJ:15,saisonJ:190}      // nKm = portions deversees par km de riviere et par an : 30 [O, Pays Perche, Sources T1] ; a remplacer par la valeur locale

function rvPar3(id){

function rvPopAn3(env,P,st,an,rng,dT,pr,cx){                  // une annee ; pr[r] = multiplicateur de survie d'ete du a la predation (1 = aucune)

        if(y>=U.ans-ny){RVUI_ST.forEach(s=>{const a=st[sk[s[0]]];for(let r=0;r<nr;r++)reach[s[0]][r]+=a[r];});
          sc.sauv+=(row.peche_sauv||0)*kk;sc.pdev+=(row.pris_dev||0)*kk;sc.dev+=(row.deverses||0)*kk;sc.heff+=(row.h_eff||0);

/* Carte de la qualite d'habitat de la fario, par stade (oeufs, 0+, 1+, adultes), choisi par les onglets du panneau Populations.
   (1) Dans le panneau : une bande le long de la riviere (amont -> aval), un carre par troncon de 25 m. Ligne "Habitat" = surface utile ponderee / surface mouillee
       au debit de reference (echelle relative au meilleur troncon du stade) ; puis la densite simulee sans lacher et avec lacher (meme echelle pour les deux). Survol = valeurs.
   (2) Dans la scene : couche "Qualite d'habitat" (Couches), DESACTIVEE par defaut. Elle colore la riviere point par point (meme fonction rvSuit que le moteur) :
       0 = inhabitable (rouge), 1 = optimal (vert). Reglages : RVHAB.dy (hauteur au-dessus de l'eau, m), RVHAB.alpha (opacite).
   La qualite est un ORDRE DE GRANDEUR DU MODELE (courbes d'habitat [M], Sources M4, P9, Q6). */
const RVHAB={dy:0.02,alpha:0.62,Qs:null,attr:null};
const RVHAB_RAMP=[[0.80,0.25,0.15],[0.96,0.80,0.22],[0.25,0.68,0.32]];                 // mauvais -> moyen -> bon (meme rampe que le shader)

function rvHabCells(H,G,M,step){                        // qualite 0..1 (rvSuit) de chaque point de la grille d'eau, par stade ; -1 = point a sec

const RC=new THREE.Raycaster(),M2=new THREE.Vector2(),PL=new THREE.Plane(new THREE.Vector3(0,1,0),0);
function zoomAt(f,cx,cy){
  const d=camera.position.distanceTo(controls.target);
  const nd=Math.max(controls.minDistance,Math.min(controls.maxDistance,d*f));f=nd/d;if(Math.abs(f-1)<1e-4)return;
  M2.set(cx/window.innerWidth*2-1,-cy/window.innerHeight*2+1);RC.setFromCamera(M2,camera);
  PL.constant=-controls.target.y;
  let p=RC.ray.intersectPlane(PL,V3);

  camera.position.sub(p).multiplyScalar(f).add(p);controls.target.sub(p).multiplyScalar(f).add(p);
}

  if(NAV.mode==="pad")return true;if(NAV.mode==="mouse")return false;
  const now=performance.now();if(e.deltaMode!==0)return false;
  if(e.deltaX!==0||Math.abs(e.deltaY)<4||e.deltaY%1!==0){NAV.lastPad=now;return true;}
  return now-NAV.lastPad<1500;
}
window.addEventListener("wheel",e=>{
  if(e.ctrlKey&&e.target!==renderer.domElement){e.preventDefault();e.stopPropagation();stopAuto();zoomAt(Math.exp(e.deltaY*0.012),e.clientX,e.clientY);return;}
  if(e.target!==renderer.domElement)return;
  e.preventDefault();e.stopPropagation();stopAuto();
  if(e.ctrlKey){zoomAt(Math.exp(e.deltaY*0.012),e.clientX,e.clientY);return;}
  const pad=isPad(e);if(pad!==NAV.pad){NAV.pad=pad;updHelp();}
  if(pad){if(e.altKey||e.shiftKey)orbitBy((e.deltaX||0)*0.004,e.deltaY*0.004);else panBy(e.deltaX,e.deltaY);}
  else zoomAt(Math.exp(e.deltaY*0.0016),e.clientX,e.clientY);
},{capture:true,passive:false});
let gScale=1;   // Safari : pincement = evenements "gesture"
window.addEventListener("gesturestart",e=>{e.preventDefault();gScale=1;},{passive:false});
window.addEventListener("gesturechange",e=>{e.preventDefault();stopAuto();const f=gScale/e.scale;gScale=e.scale;zoomAt(f,e.clientX||innerWidth/2,e.clientY||innerHeight/2);},{passive:false});
window.addEventListener("gestureend",e=>e.preventDefault(),{passive:false});
function updHelp(){$("help").textContent=t((NAV.mode==="pad"||(NAV.mode==="auto"&&NAV.pad))?"aidePad":"aideMouse");}

/* =====================================================================
   10. INTERFACE (panneau, fiches, etiquettes, langue)
   ===================================================================== */
let SEL=null;
function showCard(id){
  const d=DATA[id];if(!d)return;SEL=id;
  const c=$("card");
  c.innerHTML='<button class="x" id="cardX">×</button><h2 style="color:'+d.c+'">'+esc(L(d.n))+'</h2>'+
    '<p>'+esc(L(d.d))+'</p><div class="mec"><b>'+esc(t("mecanisme"))+'</b> '+esc(L(d.m))+'</div>'+
    '<ul>'+L(d.f).map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul><div class="warn">⚠ '+esc(t("nonVerif"))+'</div>';
  c.style.display="block";document.body.classList.add("card-open");
  $("cardX").onclick=closeCard;
  document.querySelectorAll(".lbl").forEach(b=>b.classList.toggle("sel",b.dataset.id===id));
}
function closeCard(){SEL=null;$("card").style.display="none";document.body.classList.remove("card-open");
  document.querySelectorAll(".lbl").forEach(b=>b.classList.remove("sel"));}
function select(id){showCard(id);const l=LIEUX.find(x=>x.id===id);if(l)viewLieu(l);else if(id==="troncon")viewOverview();}
function buildLabels(){
  const box=$("labels");box.innerHTML="";
  LIEUX.forEach(l=>{
    const b=document.createElement("div");b.className="lbl off"+(l.mini?" mini":"");b.dataset.id=l.id;
    if(l.mini)b.textContent=t(l.id);
    else{b.innerHTML='<i style="background:'+DATA[l.id].c+'"></i>'+esc(L(DATA[l.id].n));b.onclick=()=>select(l.id);}
    box.appendChild(b);l.el=b;l.w=0;l.hid=false;
  });
  if(SEL)document.querySelectorAll(".lbl").forEach(b=>b.classList.toggle("sel",b.dataset.id===SEL));
}
// Une etiquette est cachee si une colline est entre elle et la camera
function occluded(pos){
  const c=camera.position,T=CFG.terrain;
  for(let k=1;k<14;k++){const f=k/14;V3.lerpVectors(c,pos,f);
    if(Math.abs(V3.x)>T.X/2)continue;if(HY.height(V3.x,V3.z)>V3.y+0.4)return true;}
  return false;
}
let frameN=0;
function placeLabels(){
  const labOn=FX.find(f=>f.id==="etiquettes").on;
  const W=window.innerWidth,Hh=window.innerHeight,shown=[];
  if(frameN%4===0)LIEUX.forEach(l=>{l.hid=occluded(l.pos);});
  const order=LIEUX.slice().sort((a,b)=>(b.id===SEL)-(a.id===SEL)||camera.position.distanceTo(a.pos)-camera.position.distanceTo(b.pos));
  order.forEach(l=>{
    if(!l.el)return;
    if(!labOn&&!l.mini){l.el.classList.add("off");return;}
    V1.copy(l.pos).project(camera);
    const d=camera.position.distanceTo(l.pos);
    if(V1.z>1||d>700||Math.abs(V1.x)>1.05||Math.abs(V1.y)>1.05||l.hid){l.el.classList.add("off");return;}
    const x=(V1.x+1)/2*W,y=(1-V1.y)/2*Hh;
    if(!l.w)l.w=l.el.offsetWidth||90;
    const r={x0:x-l.w/2,x1:x+l.w/2,y0:y-44,y1:y-12};
    if(shown.some(o=>r.x0<o.x1+4&&r.x1>o.x0-4&&r.y0<o.y1+2&&r.y1>o.y0-2)){l.el.classList.add("off");return;}
    shown.push(r);l.el.classList.remove("off");
    l.el.style.transform="translate("+x.toFixed(1)+"px,"+y.toFixed(1)+"px) translate(-50%,-150%)";
  });
}
function buildPanel(){
  document.querySelectorAll("[data-t]").forEach(e=>{e.textContent=t(e.dataset.t);});
  const li=$("lieux");li.innerHTML="";
  ["troncon","litMineur","radier","mouille","meandre","concave","convexe","ilot","blocs","herbier","frayere","boismort","affluent","p_hameau","p_vaches","p_usine","litMajeur"].forEach(id=>{
    if(id!=="troncon"&&!LIEUX.find(l=>l.id===id))return;
    const b=document.createElement("button");
    b.innerHTML='<span class="dot" style="background:'+DATA[id].c+'"></span>'+esc(L(DATA[id].n));
    b.onclick=()=>select(id);li.appendChild(b);
  });
  const co=$("couches");co.innerHTML="";const hc=$("habCouches");if(hc)hc.innerHTML="";   // HABITAT1
  MODS.forEach(m=>{
    if(m.id==="ciel"||m.id==="terrain")return;   // HABITAT1 : ces deux couches ne se masquent plus
    const l=document.createElement("label");l.className="ck";
    l.innerHTML='<input type="checkbox"'+(m.on?" checked":"")+'><span>'+esc(L(m.nom))+'</span>';
    l.querySelector("input").onchange=e=>{m.on=e.target.checked;if(m.obj)m.obj.visible=m.on;if(m.toggle)m.toggle(m.on);};
    ((m.id==="frayeres"||m.id==="habitat")&&hc?hc:co).appendChild(l);   // HABITAT1 : cartes d'habitat dans le menu Habitat
  });
  rvPressMenuUI();rvLieuxCk();rvEspUI();rvSideUI();
  const ef=$("effets");ef.innerHTML="";
  FX.forEach(f=>{
    if(f.id==="etiquettes")return;   // LIEUX1 : meme reglage que la case du menu Lieux
    const l=document.createElement("label");l.className="ck";
    l.innerHTML='<input type="checkbox"'+(f.on?" checked":"")+'><span>'+esc(t(f.id))+'</span>';
    l.querySelector("input").onchange=e=>{f.on=e.target.checked;f.set(f.on);};
    ef.appendChild(l);
  });
  const qu=$("qual");qu.innerHTML="";
  ["high","medium","low"].forEach(k=>{
    const b=document.createElement("button");b.textContent=t(k);b.dataset.q=k;b.classList.toggle("on",Q.key===k);
    b.onclick=()=>busy(()=>setQuality(k));qu.appendChild(b);
  });
  const nv=$("navm");nv.innerHTML="";
  [["auto","navAuto"],["pad","navPad"],["mouse","navMouse"]].forEach(([k,lab])=>{
    const b=document.createElement("button");b.textContent=t(lab);b.classList.toggle("on",NAV.mode===k);
    b.onclick=()=>{NAV.mode=k;buildPanel();};nv.appendChild(b);
  });
  $("leg").innerHTML=["leg1:#d97757","leg2:#1f4038","leg3:#eef3f3","leg4:#a79a7f","legG0:","legG1:#c9b883","legG2:#b38a4c","legG3:#7d7361","legG4:#4d5052","legG5:#5e5441","legG6:","legF1:#ff7a3d","legG7:","leg5:#8e9a55","leg7:#5f8a8a","leg6:"].map(s=>{
    const [k,c]=s.split(":");return '<div class="leg">'+(c?'<span style="background:'+c+'"></span>':'')+esc(t(k))+'</div>';}).join("");
  buildLabels();if(SEL)showCard(SEL);updSliderTxt();updHelp();
}
function updSliderTxt(){
  const h=ENV.hour,hh=Math.floor(h),mm=Math.round((h-hh)*60);
  $("vHeure").textContent=hh+"h"+String(mm===60?0:mm).padStart(2,"0");
  $("vCourant").textContent="×"+ST.flow.toFixed(2);
  $("vTurb").textContent=ST.turb.toFixed(1);
  $("vCrue").textContent="+"+ST.flood.toFixed(2)+" m";
}
$("sHeure").oninput=e=>{ENV.hour=+e.target.value;updateEnv();updSliderTxt();};
$("sCourant").oninput=e=>{ST.flow=+e.target.value;updSliderTxt();};
$("sTurb").oninput=e=>{ST.turb=+e.target.value;updSliderTxt();};
$("sCrue").oninput=e=>{ST.flood=+e.target.value;updSliderTxt();};
$("bEns").onclick=()=>{closeCard();viewOverview();};
$("bRas").onclick=()=>{closeCard();viewWater();};
$("bSurvol").onclick=()=>{closeCard();startAlong();};
$("bSub").onclick=()=>{closeCard();viewUnder();};
$("bNew").onclick=()=>busy(()=>{
  HY=rvUC(rvAff(makeHydro(1+Math.floor(Math.random()*1e6))));rvRocksInit(HY);   // ROCHERS1
  buildAll();FX.forEach(f=>f.set(f.on));buildLieux();buildPanel();closeCard();
  const p=overviewPose();camera.position.copy(p[0]);controls.target.copy(p[1]);
});
$("fold").onclick=()=>{const p=$("panel");p.classList.toggle("closed");$("fold").textContent=p.classList.contains("closed")?"+":"–";};
$("lang").onclick=()=>{LANG=LANG==="fr"?"en":"fr";document.documentElement.lang=LANG;buildPanel();};
controls.addEventListener("start",stopAuto);
window.addEventListener("keydown",e=>{if(e.key==="Escape"){closeCard();viewOverview();}});
function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
  LIEUX.forEach(l=>{l.w=0;});}
window.addEventListener("resize",resize);

/* =====================================================================
   11. BOUCLE D'ANIMATION (une seule)
   ===================================================================== */
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.1);
  ST.time+=dt;frameN++;
  U.time.value=ST.time;U.sunCol.value.copy(ENV.sunCol).multiplyScalar(ENV.light);
  updCam(dt);controls.update();updShadowFrame();
  for(const m of MODS){if(m.obj&&m.on&&m.update){try{m.update(ctx,dt);}catch(e){window.__showErr("Module "+m.id+" : "+e.message);m.update=null;}}}
  /* ===== BOUCLE PATCHS ===== */
  rvUWUpdate();rvFadeUpdate();rvNavUpdate(dt);rvFishTick(dt);
  rvWQRender();
  renderer.render(scene,camera);
  placeLabels();
}

/* =====================================================================
   12. DEMARRAGE
   ===================================================================== */
$("loading").textContent=t("chargement");
setTimeout(()=>{
  const small=(navigator.hardwareConcurrency||8)<=4||window.innerWidth<700;
  resize();updateEnv();
  setQuality(small?"medium":"high");
  buildLieux();buildPanel();
  const p=overviewPose();camera.position.copy(p[0]);controls.target.copy(p[1]);controls.update();
  $("loading").style.display="none";
  loop();
},40);
})();
</script>
