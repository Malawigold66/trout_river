<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rivière à truites</title>
<style>
:root{--acc:#d97757;--txt:#f1f4f2;--mut:#c3cdc9;--glass:rgba(18,28,30,.55);--brd:rgba(255,255,255,.16)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#a9c3cf;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#scene{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);border:1px solid var(--brd);box-shadow:0 10px 30px rgba(0,0,0,.22);border-radius:14px}
#panel{position:fixed;top:14px;left:14px;width:300px;max-width:calc(100vw - 28px);max-height:calc(100vh - 28px);overflow:auto;padding:14px 14px 8px;z-index:10}
#panel .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#panel.closed .body{display:none}
h1{font-family:Georgia,"Times New Roman",serif;font-size:21px;font-weight:600;margin:0}
.sub{font-size:12px;color:var(--mut);margin:2px 0 8px;line-height:1.4}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
button{font:inherit;font-size:12.5px;color:var(--txt);background:rgba(255,255,255,.08);border:1px solid var(--brd);border-radius:8px;padding:6px 10px;cursor:pointer;min-height:30px}
button:hover{background:rgba(255,255,255,.16)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.on{border-color:var(--acc);color:#fff;background:rgba(217,119,87,.35)}
button .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
details{border-top:1px solid var(--brd);padding:4px 0}
summary{cursor:pointer;font-size:13px;font-weight:600;padding:6px 0;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";color:var(--mut)}
details[open]>summary{color:var(--acc)}
details[open]>summary::before{content:"▾ "}
label.ck{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;cursor:pointer;min-height:26px}
input[type=checkbox],input[type=range]{accent-color:var(--acc)}
input[type=checkbox]{width:16px;height:16px}
.sl{font-size:12.5px;margin:8px 0}
.sl b{float:right;font-weight:500;color:var(--mut)}
.sl input{width:100%}
.lab{font-size:12px;color:var(--mut);margin-top:8px}
.leg{font-size:12px;line-height:1.45;color:var(--mut);margin:4px 0}
.leg span{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
#card{position:fixed;top:14px;right:14px;width:330px;max-width:calc(100vw - 28px);max-height:calc(100vh - 80px);overflow:auto;padding:14px 16px;z-index:11;display:none}
#card h2{font-family:Georgia,serif;font-size:19px;margin:0 30px 6px 0}
#card p{font-size:13.5px;line-height:1.5;margin:6px 0}
#card .mec{font-size:13px;line-height:1.5;background:rgba(255,255,255,.06);border-radius:8px;padding:8px 10px;margin:8px 0}
#card ul{margin:6px 0 4px;padding-left:18px;font-size:13px;line-height:1.55}
#card .warn{font-size:11.5px;color:#f3c9a0;margin-top:8px}
#card .x{position:absolute;top:10px;right:10px;min-height:26px;padding:2px 9px}
#labels{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;padding:4px 11px 4px 8px;min-height:26px;border-radius:999px;background:rgba(18,28,30,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:12.5px;white-space:nowrap;cursor:pointer;transition:opacity .25s}
.lbl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:12px;background:rgba(255,255,255,.55)}
.lbl i{width:9px;height:9px;border-radius:50%}
.lbl:hover,.lbl.sel{border-color:var(--acc);box-shadow:0 0 0 2px rgba(217,119,87,.45)}
.lbl.mini{background:rgba(18,28,30,.4);font-size:11.5px;cursor:default}
.lbl.off{opacity:0;pointer-events:none}
#lang{position:fixed;top:14px;right:14px;z-index:12}
body.card-open #lang{right:358px}
#help{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-size:11.5px;color:#fff;padding:5px 12px;z-index:4;white-space:nowrap}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:20px;color:#fff;background:#6f8f9c;z-index:40}
#err{position:fixed;bottom:44px;right:10px;max-width:520px;max-height:40vh;overflow:auto;background:rgba(120,24,24,.93);color:#fff;font:12px/1.4 Menlo,monospace;padding:10px 12px;border-radius:10px;white-space:pre-wrap;display:none;z-index:60}
@media (max-width:700px){#panel{width:calc(100vw - 28px);max-height:46vh}#help{display:none}body.card-open #lang{display:none}#card{top:auto;bottom:14px;max-height:45vh}}
/* ===== BLOC POPULATIONS (css) ===== */
#rvSide{position:fixed;top:58px;right:14px;width:372px;max-width:calc(100vw - 28px);max-height:calc(100vh - 72px);overflow:auto;padding:12px 14px 10px;z-index:9;display:none}
body.rv-side #rvSide{display:block}
body.rv-side #card{right:398px}
body.rv-side.card-open #lang{right:742px}
#rvSide h2{font-family:Georgia,serif;font-size:17px;font-weight:600;margin:0}
#rvSide canvas.rvc{width:100%;display:block;border-radius:6px;background:rgba(255,255,255,.05);margin:3px 0 2px}
#rvSide table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0 4px}
#rvSide td,#rvSide th{padding:2px 4px;text-align:right;border-top:1px solid var(--brd);font-weight:500}
#rvSide td:first-child,#rvSide th:first-child{text-align:left;color:var(--mut)}
#rvSide input:disabled{opacity:.4}
@media (max-width:700px){#rvSide{top:auto;bottom:14px;left:14px;right:14px;width:auto;max-height:44vh}body.rv-side #card{right:14px}body.rv-side.card-open #lang{display:none}}
/* ===== FIN BLOC POPULATIONS (css) ===== */
/* ===== CSS PATCHS ===== */
/* BLOC CASES1 : la case a cocher garde sa taille quand le libelle passe sur deux lignes (le label est en flex) */
label.ck input[type=checkbox]{flex:none}
label.ck input[type=radio]{flex:none}
.pbul{font-size:12px;line-height:1.45;padding:8px 10px;margin:8px 0 4px;border-radius:8px;border-left:3px solid var(--acc);background:rgba(217,119,87,.10)}
.rvtip{position:fixed;z-index:60;display:none;pointer-events:none;font-size:11.5px;line-height:1.4;padding:5px 8px;border-radius:7px;background:rgba(20,24,22,.94);border:1px solid rgba(255,255,255,.25);color:#f1f1ea;white-space:nowrap}
/* BLOC LIEUX1 : bouton Dynamique des populations, bien visible */
button.pop{display:block;width:100%;margin:0 0 8px;padding:9px 12px;font-weight:600;font-size:13px;color:#fff;border:1.5px solid var(--acc);background:linear-gradient(135deg,rgba(217,119,87,.28),rgba(217,119,87,.08))}
button.pop::after{content:" \25B8"}
button.pop.on{background:var(--acc)}
button.blu{display:block;width:100%;margin:0 0 8px;padding:9px 12px;font-weight:600;font-size:13px;color:#fff;border:1.5px solid #3a7bd5;background:#3a7bd5}
button.blu:hover{background:#4a8be5}
button.pop.on::after{content:" \25C2"}
/* ===== CSS DES MENUS (ex-styles injectes par TITRES1, RANGEMENT1, AJUST1, AJUST2, meme ordre : la cascade est inchangee) ===== */
.rvH2{font-weight:700;font-size:13.5px;margin:16px 0 4px;padding:4px 8px;border-left:3px solid #9fb4c0;background:rgba(159,180,192,.14);border-radius:4px}
#rvSide .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}#rvX{flex:none;padding:2px 10px;font-size:18px;line-height:1.2}#panel input:disabled{opacity:.4}.rvH3{font-weight:700;font-size:12.5px;margin:12px 0 4px;padding-top:8px;border-top:1px solid var(--brd)}button.ib{display:block;width:100%;text-align:left;margin:4px 0}
#selCtx,#selPrMet{font-size:12.5px!important}#panel .head>div:first-child{display:flex;align-items:center;gap:10px;flex-wrap:wrap}#panel #lang{position:static;padding:3px 9px;font-size:12px;min-height:0;line-height:1.4}@media (min-width:701px){#panel{max-height:calc(100vh - 66px)}#rvSide{max-height:calc(100vh - 110px)}}
@media (min-width:701px){#panel{width:332px}#rvSide{top:14px;max-height:calc(100vh - 66px)}}
/* ===== CSS POPFISH1 : barre d'annee ===== */
#rvYear{position:fixed;left:50%;bottom:46px;transform:translateX(-50%);z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px;box-sizing:border-box;width:min(92vw,640px);padding:7px 14px;border-radius:12px;font-size:12px;color:#fff;background:rgba(40,52,58,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);box-shadow:0 4px 18px rgba(0,0,0,.25)}
#rvYear button{flex:none;min-width:34px;padding:4px 8px;font-size:14px;line-height:1.2}
#rvYear b{flex:none;min-width:48px;text-align:center}
#rvYear input[type=range]{flex:1;min-width:120px;accent-color:#d97757}
#rvYn{flex-basis:100%;text-align:center;font-size:10.5px;opacity:.85;line-height:1.3}
@media (max-width:700px){#rvYn{display:none}#rvYear{bottom:14px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>

<div id="panel" class="glass">
  <div class="head">
    <div><h1 data-t="titre"></h1><div class="sub" data-t="sous"></div></div>
    <button id="fold" title="Replier">–</button>
  </div>
  <div class="body">
    <button id="bNew" class="blu" data-t="nouvelle"></button>
    <button id="bPop" class="pop" data-t="popBtn"></button>
    <div class="row">
      <button class="pri" id="bEns" data-t="vEns"></button>
      <button id="bRas" data-t="vRas"></button>
      <button id="bSurvol" data-t="vSurvol"></button>
      <button id="bSub" data-t="vSub"></button>
    </div>
    <details><summary data-t="espT"></summary><div id="espBtns" class="row"></div><div id="espCk"></div></details>
    <details><summary data-t="habT"></summary>
      <div class="lab" data-t="ctxT"></div>
      <div class="row"><select id="selCtx" style="width:100%;padding:6px 8px;border-radius:8px;background:rgba(10,14,12,.55);color:#f1f1ea;border:1px solid rgba(255,255,255,.22);font:inherit"><option value="froid" data-t="ctxFroid"></option><option value="pied" data-t="ctxPied" selected></option><option value="chaud" data-t="ctxChaud"></option></select></div>
      <div class="row"><button id="bHabInfo" data-t="habInfoB"></button></div>
      <div class="pbul" id="habBul" data-t="habInfo" style="display:none;white-space:pre-line"></div>
      <div class="row"><button id="bSaine" data-t="habSaine"></button><button id="bDefaut" data-t="habDefaut"></button></div>
      <div class="sl"><span data-t="bmQ"></span><b id="vBmQ"></b><input type="range" id="sBmQ" min="0" max="3" step="0.1" value="1.8"></div>
      <div class="sl"><span data-t="bmP"></span><b id="vBmP"></b><input type="range" id="sBmP" min="0" max="100" step="5" value="70"></div>
      <div class="sl"><span data-t="rkQ"></span><b id="vRkQ"></b><input type="range" id="sRkQ" min="0" max="3" step="0.1" value="1.5"></div>
      <div class="sl"><span data-t="hbQ"></span><b id="vHbQ"></b><input type="range" id="sHbQ" min="0" max="3" step="0.1" value="1"></div>
      <div class="sl"><span data-t="rpD"></span><b id="vRpD"></b><input type="range" id="sRpD" min="0" max="3" step="0.1" value="1"></div>
      <div class="lab" data-t="habCartes"></div>
      <div id="habCouches"></div>
    </details>
    <details id="detPress"><summary data-t="pressMenu"></summary>
      <div class="lab" id="pressNote"></div>
      <div class="row"><button id="bPressInfo" data-t="pressInfoB"></button></div>
      <div class="pbul" id="pressInfo" data-t="pressInfo" style="display:none;white-space:pre-line"></div>
      <label class="ck"><input type="radio" name="pressK" value="none" checked><span data-t="pressNone"></span></label>
      <label class="ck"><input type="radio" name="pressK" value="hameau"><span data-t="pressHam"></span></label>
      <label class="ck"><input type="radio" name="pressK" value="vaches"><span data-t="pressVac"></span></label>
      <label class="ck"><input type="radio" name="pressK" value="usine"><span data-t="pressUsi"></span></label>
      <div class="sl"><span data-t="pressInt"></span><b id="vPrI"></b><input type="range" id="sPrI" min="5" max="100" step="5" value="50"></div>
      <label class="ck"><input type="checkbox" id="ckPrLoc"><span data-t="pressLoc"></span></label>
      <div id="pressUsi" style="display:none">
        <label class="ck"><input type="checkbox" id="ckPrHeat"><span data-t="pressHeat"></span></label>
        <div class="lab" data-t="pressMetal"></div><div class="row"><select id="selPrMet" style="width:100%;padding:6px 8px;border-radius:8px;background:rgba(10,14,12,.55);color:#f1f1ea;border:1px solid rgba(255,255,255,.22);font:inherit"></select></div>
        <div class="sl" id="pressHardRow" style="display:none"><span data-t="pressHard"></span><b id="vPrH"></b><input type="range" id="sPrH" min="29" max="151" step="1" value="50"></div>
      </div>
      <div class="pbul" id="pressBulle" style="display:none"></div>
    </details>
    <details id="detInfo"><summary data-t="infoMenu"></summary><div id="infoList"></div></details>
    <details><summary data-t="couches"></summary><div id="couches"></div></details>
    <details><summary data-t="effets"></summary>
      <div id="effets"></div>
      <div class="sl"><span data-t="halo"></span><b id="vHalo"></b><input type="range" id="sHalo" min="0" max="40" step="1" value="11"></div>
      <div class="sl"><span data-t="canopeeT"></span><b id="vCan"></b><input type="range" id="sCan" min="0" max="100" step="1" value="0"></div>
      <label class="ck"><input type="checkbox" id="ckUWPart" checked><span data-t="uwPart"></span></label>
      <label class="ck"><input type="checkbox" id="ckFlowLink" checked><span data-t="flowLink"></span></label>
      <label class="ck"><input type="checkbox" id="ckFish" checked><span data-t="fishCk"></span></label>
      <div class="sl"><span data-t="rkSize"></span><b id="vRkS"></b><input type="range" id="sRkS" min="0.4" max="1.2" step="0.05" value="0.7"></div>
      <div class="sl"><span data-t="plSize"></span><b id="vPlS"></b><input type="range" id="sPlS" min="0.4" max="1.2" step="0.05" value="0.7"></div>
      <div class="lab" data-t="qualite"></div>
      <div class="row" id="qual"></div>
      <div class="lab" data-t="nav"></div>
      <div class="row" id="navm"></div>
    </details>
    <details><summary data-t="lieux"></summary>
      <label class="ck"><input type="checkbox" id="ckLieux" checked><span data-t="lieuxCk"></span></label>
      <div id="lieux" class="row"></div>
    </details>
    <details><summary data-t="reglages"></summary>
      <div class="sl"><span data-t="crue"></span><b id="vCrue"></b><input type="range" id="sCrue" min="0" max="3" step="0.05" value="0"></div>
      <div class="sl"><span data-t="heure"></span><b id="vHeure"></b><input type="range" id="sHeure" min="6" max="20.5" step="0.1" value="10.5"></div>
      <div class="sl"><span data-t="courant"></span><b id="vCourant"></b><input type="range" id="sCourant" min="0" max="2" step="0.05" value="1"></div>
      <div class="sl"><span data-t="turbidite"></span><b id="vTurb"></b><input type="range" id="sTurb" min="0.4" max="5" step="0.1" value="0.8"></div>
    </details>
    <details><summary data-t="legende"></summary><div id="leg"></div></details>
  </div>
</div>

<div id="card" class="glass"></div>
<div id="rvSide" class="glass">
  <div class="head"><div><h2 data-t="popT"></h2><div class="sub" data-t="popSub"></div></div><button id="rvX">×</button></div>
  <label class="ck"><input type="checkbox" id="rvCkPe"><span data-t="espPeche"></span></label>
  <div class="sl"><span data-t="popH"></span><b id="rvVh"></b><input type="range" id="rvH" min="0" max="95" step="5" value="65"></div>
  <label class="ck"><input type="checkbox" id="rvCkDe"><span data-t="espDevers"></span></label>
  <div class="sl"><span data-t="popN"></span><b id="rvVn"></b><input type="range" id="rvN" min="0" max="100" step="5" value="30"></div>
  <label class="ck"><input type="checkbox" id="rvCkSv"><span data-t="popSv"></span></label>
  <div class="lab" id="rvSvInfo"></div>
  <div class="sl"><span data-t="popDT"></span><b id="rvVdt"></b><input type="range" id="rvDT" min="0" max="4" step="0.5" value="0"></div>
  <div class="lab" data-t="popDTnote"></div>
  <div class="lab" id="rvInfo"></div>
  <div id="rvCh"></div>
  <div id="rvMap"></div>
  <div id="rvOth"></div>
  <div class="lab" id="rvNote"></div>
</div>
<button id="lang" class="glass">FR | EN</button>
<div id="help" class="glass"></div>
<div id="loading">Construction du tronçon…</div>
<div id="err"></div>

<!-- Garde-fou : toute erreur s'affiche a l'ecran (bloc place AVANT les scripts externes) -->
<script>
(function(){
  var box=document.getElementById("err");
  function show(m){ box.style.display="block"; box.textContent+=m+"\n"; }
  window.__showErr=show;
  window.addEventListener("error",function(e){ show("Erreur : "+e.message+(e.lineno?" (ligne "+e.lineno+")":"")); });
  window.addEventListener("unhandledrejection",function(e){ show("Erreur : "+((e.reason&&e.reason.message)||e.reason)); });
  var ce=console.error;
  console.error=function(){ try{ show("Console : "+Array.prototype.map.call(arguments,String).join(" ").slice(0,600)); }catch(_){}
    ce.apply(console,arguments); };
})();
</script>

/* =====================================================================
   1. CONFIGURATION (1 unite = 1 metre)
   Valeurs de MODELE : plausibles, non mesurees sur un site reel.
   ===================================================================== */
const CFG={
  seed:7,                 // graine : meme graine = meme riviere
  reach:{
    W:6,                  // largeur moyenne du lit mineur (m) ; ruisseau a truites de 6-7 m (15 = ancienne echelle)
    lambdaW:12,           // longueur d'onde moyenne des meandres, en largeurs
    thetaMin:0.22,        // angle max d'un meandre peu marque (rad)
    thetaMax:1.05,        // angle max d'un meandre tres marque (rad)
    restore:0.006,        // rappel vers l'axe de la vallee
    poolShift:0.06,       // mouille decalee vers l'aval de l'apex
    poolSpacingW:6.5,     // espacement des mouilles en ligne droite, en largeurs
    slope:0.004,          // pente moyenne de la ligne d'eau
    depthRiffle:0.30, /* HABITAT2 : avant 0,38 (origine 0,28) */     // profondeur max d'un radier (m)
    depthPool:1.25, /* HABITAT2 : avant 1,1 (origine 0,75) */ /* MOUILLES1 : avant 0,75. Mouilles plus profondes : max par section ~1,8 m au p90 (pêches electriques de l'utilisateur : mouilles de 1 a 2 m) [T] */   /* profondeur de base d'une mouille (m) ; max reel ~1,4 m (voir Sources_Riviere.txt, a verifier) */
            // profondeur max d'une mouille (m)
    bankH:1.3,            // hauteur des berges au-dessus de l'eau (m)
    islandEvery:230,      // un ilot tous les ~230 m
    rockDensity:0.75,
    regles:true,          /* meandres selon Leopold-Wolman (false = ancien trace) */
    lamMin:9,lamMax:15,  // longueur d'onde du meandre, en largeurs du lit (Leopold-Wolman : 10-14 en moyenne)
    rcMin:1.5,rcMax:2.4,    // rayon de courbure au sommet, en largeurs du lit (Leopold-Wolman : 2-3 le plus souvent)
    angSeuil:0.55,        // plus petit = plus de coudes anguleux
    wander:30,wlen:75,   /* la riviere derive dans la vallee (amplitude en m, longueur d'onde = 2*pi*wlen) */
    petit:0.2,             // part de petits meandres serres dans les tronçons sinueux
    variete:0.7           /* 0 = riviere reguliere, 1 = tres variee (resserrements, sinuosite, profondeurs) */
  },
  valley:{axisAmp:14,axisLen:260,fpHalf:62,terraceH:3.2,terraceW:9,hillRise:0.11},
  terrain:{X:600,Z:260,fine:52,mid:85},
  water:{margin:3},
  fog:{near:170,far:1150},
  quality:{
    high:  {seg:1.0,waterStep:1,waterAcross:26,shadow:4096,pr:2,  rockDetail:3,floodStep:2},

  popDTnote:{fr:"Hausse due au climat seul, progressive sur 50 ans. Elle s'ajoute à l'effet local de l'ombre et au contexte thermique.",en:"Rise due to climate alone, gradual over 50 years. It adds to the local shading effect and the thermal setting."},
  habInfoB:{fr:"ⓘ Habitat : facteurs, interactions et effets",en:"ⓘ Habitat: factors, interactions and effects"},
  habInfo:{fr:"• Refuges (rochers, bois mort, herbiers, berges creusées, mouilles) : plus il y en a, mieux survivent les 0+ (en hiver), les 1+ et les adultes. Même à ×3, les blocs ne couvrent qu'environ 18 % de la surface mouillée (mesure du modèle) : le lit n'est pas saturé.\n• Ripisylve : son ombre refroidit l'eau d'été (jusqu'à 2,4 °C entre aucune ombre et ombre totale) mais supprime les renoncules sous ombrage dense.\n• Contexte thermique : température de base de la rivière (montagne froide, piémont, plaine chaude).\n• Réchauffement climatique (panneau Populations) : s'ajoute à l'ombre et au contexte.\n• Abris partagés (case ci-dessous, cochée par défaut) : le chabot et les juvéniles de truite fario (0+ et 1+) se disputent les mêmes abris ; moins il y en a, plus chaque espèce perd de survie selon la densité de l'autre. Coefficient 0,2 [M] (Roussel 1994, cité, qualitatif ; Sources AF4). Poser du bois ou des blocs réduit cette compétition.\nLa chaleur d'été (contexte + ombre + climat) agit à part : stress dès 19,5 °C de pic, létal à 25 °C. Les refuges ne l'annulent pas. L'ombre ne pèse donc que si la rivière approche 19,5 °C : plaine chaude ou réchauffement.\nValeurs : ordres de grandeur du modèle, voir Sources_Riviere (section AE).",
   en:"• Shelter (rocks, deadwood, aquatic beds, undercut banks, pools): the more there is, the better 0+ (in winter), 1+ and adults survive. Even at ×3, boulders cover only about 18% of the wetted area (model measurement): the bed is not choked.\n• Riparian trees: their shade cools summer water (up to 2.4 °C between no shade and full shade) but removes water-crowfoot under dense shade.\n• Thermal setting: the river's base temperature (cold mountain, foothills, warm lowland).\n• Climate warming (Populations panel): adds to shade and setting.\n• Shared shelters (box below, ticked by default): bullhead and juvenile brown trout (0+ and 1+) compete for the same shelter; the scarcer it is, the more each species loses survival with the other's density. Coefficient 0.2 [M] (Roussel 1994, cited, qualitative; Sources AF4). Adding wood or boulders reduces this competition.\nSummer heat (setting + shade + climate) acts separately: stress from a 19.5 °C peak, lethal at 25 °C. Shelter does not cancel it. So shade only matters when the river gets close to 19.5 °C: warm lowland or warming.\nValues: model orders of magnitude, see Sources_Riviere (section AE)."},
  pressInfoB:{fr:"ⓘ Fonctionnement des pressions anthropiques",en:"ⓘ How human pressures work"},
  pressInfo:{fr:"• Une seule pression anthropique à la fois : hameau (ammoniac, surtout œufs et alevins), vaches (fines qui colmatent les graviers, surtout œufs) ou usine (chaleur et / ou métal, au choix).\n• Intensité : 100 % = niveau sévère à la confluence de l'affluent ; l'effet s'atténue vers l'aval (300 m à 1000 m selon la pression).\n• Lecture : courbes en amont et en aval de l'affluent, par classe de taille, comparées aux réglages d'Habitat du moment.\n• Interactions : la chaleur de l'usine s'ajoute à l'ombre, au contexte thermique et au réchauffement climatique, donc elle est plus nocive sur une eau déjà chaude. Les refuges de l'habitat ne neutralisent ni l'ammoniac, ni les fines, ni les métaux.\n• Pêche et déversement : réglages indépendants, plus bas dans ce menu ; ils s'ajoutent à la pression anthropique choisie.\n• Statut des valeurs : [V] lue, [O] indirecte, [M] ordre de grandeur du modèle (Sources_Riviere, section AD).",
   en:"• One human pressure at a time: hamlet (ammonia, mostly eggs and fry), cows (fines that clog gravels, mostly eggs) or factory (heat and / or metal, your choice).\n• Intensity: 100% = severe level at the tributary confluence; the effect fades downstream (300 m to 1000 m depending on the pressure).\n• Reading: curves upstream and downstream of the tributary, per size class, compared with the current Habitat settings.\n• Interactions: factory heat adds to shade, thermal setting and climate warming, so it is more harmful on already warm water. Habitat shelter does not neutralise ammonia, fines or metals.\n• Angling and stocking: independent settings, further down in this menu; they add to the selected human pressure.\n• Status of values: [V] read, [O] indirect, [M] model order of magnitude (Sources_Riviere, section AD)."},

  pressNoPos:{fr:"Aucune pression anthropique n'a pu être placée sur cette rivière : essaie « nouvelle rivière ».",en:"No human pressure could be placed on this river: try “new river”."},
  bulH:{fr:"Hameau, eaux usées : l'ammoniac (NH3) tue d'abord les œufs et les alevins ; juvéniles et adultes ne sont touchés qu'à des doses bien plus fortes. Intensité 100 % = 0,025 mg/L à la confluence (standard provisoire européen) [O : truite arc-en-ciel]. L'effet s'atténue vers l'aval (500 m [M]). L'oxygène n'est pas modélisé.",
        en:"Hamlet, wastewater: ammonia (NH3) kills eggs and fry first; juveniles and adults are only hit at much higher doses. Intensity 100% = 0.025 mg/L at the confluence (provisional European standard) [O: rainbow trout]. The effect fades downstream (500 m [M]). Oxygen is not modelled."},
  bulV:{fr:"Vaches, sédiments fins : le bétail apporte des fines minérales et organiques qui colmatent les graviers et étouffent les œufs. Intensité 100 % = 20 % de fines à la confluence ; l'émergence tombe à 50 % vers 13 % de fines [O : salmonidés, Jensen 2009, Kondolf 2000]. Les adultes de fario ne sont touchés qu'ensuite, faute d'œufs. Chabot et vairon : œufs étouffés (jusqu'à 90 % et 50 %) et, pour le chabot, moins d'adultes (capacité jusqu'à -90 %) [M, Sources AF]. Persistance 300 m [M]. Le piétinement des berges n'est pas modélisé.",
        en:"Cows, fine sediment: livestock bring mineral and organic fines that clog gravels and smother eggs. Intensity 100% = 20% fines at the confluence; emergence falls to 50% around 13% fines [O: salmonids, Jensen 2009, Kondolf 2000]. Brown trout adults are only affected later, through fewer eggs. Bullhead and minnow: smothered eggs (up to 90% and 50%) and, for bullhead, fewer adults (capacity down to 90%) [M, Sources AF]. Persistence 300 m [M]. Bank trampling is not modelled."},
  bulU:{fr:"Usine : chaleur et / ou métal, au choix ; les deux effets s'ajoutent, supposés indépendants [M].",en:"Factory: heat and / or one metal, your choice; the two effects add up, assumed independent [M]."},
  bulU0:{fr:"Coche la chaleur ou choisis un métal pour qu'il y ait un effet.",en:"Tick heat or pick a metal for anything to happen."},
  bulUh:{fr:"Chaleur : +6 °C à 100 % (écart entre le pic d'été sans ombre, 18,9 °C [M], et la limite létale de 25 °C [V]) ; stress thermique au-dessus de 19,5 °C [V] ; touche surtout les 1+ et les adultes ; persistance 1000 m [M].",
         en:"Heat: +6 °C at 100% (gap between the unshaded summer peak, 18.9 °C [M], and the 25 °C lethal limit [V]); thermal stress above 19.5 °C [V]; hits mostly 1+ and adults; persistence 1000 m [M]."},
  bulUz:{fr:"Zinc : 100 % = 620 µg/L à la confluence, la CL50 96 h [V : Everall 1987, pH 7] ; touche 0+, 1+ et adultes [O]. Persistance 300 m [M].",en:"Zinc: 100% = 620 µg/L at the confluence, the 96 h LC50 [V: Everall 1987, pH 7]; hits 0+, 1+ and adults [O]. Persistence 300 m [M]."},
  bulUc:{fr:"Cadmium : très toxique pour les alevins (CL50 96 h de 1,2 µg/L à dureté 29 à 10 µg/L à dureté 151 [V : Brinkman et Hansen]) ; embryons peu touchés [V] ; seuls les 0+ sont touchés dans le modèle (juvéniles et adultes non documentés). 100 % = la CL50 de la dureté choisie. Persistance 300 m [M].",
         en:"Cadmium: very toxic to fry (96 h LC50 from 1.2 µg/L at hardness 29 to 10 µg/L at hardness 151 [V: Brinkman and Hansen]); embryos little affected [V]; only 0+ are hit in the model (juveniles and adults undocumented). 100% = the LC50 of the chosen hardness. Persistence 300 m [M]."},
  bulComp:{fr:"La pression anthropique démarre à l'année {n} (barre verticale sur les courbes) ; les années précédentes servent de référence. Les courbes de « Dynamique des populations » tiennent compte de cette pression anthropique et des réglages d'habitat du moment.",en:"The human pressure starts in year {n} (vertical bar on the curves); earlier years are the reference. The curves in “Population dynamics” include this human pressure and the current habitat settings."},
  bulLeg:{fr:"[V] lu sur la truite fario · [O] ordre de grandeur (autre salmonidé) · [M] choix du modèle. Résultats du modèle, pas des prévisions.",en:"[V] read on brown trout · [O] order of magnitude (other salmonid) · [M] model choice. Model results, not forecasts."},

  avNoteL:{fr:"Moyennes des {m} dernières années. L'amont peut baisser un peu : une part des géniteurs migre pour pondre et les adultes se dispersent. La vraie référence est « aval, sans pression anthropique ».",en:"Means of the last {m} years. Upstream may drop a little: a share of spawners migrate to spawn and adults disperse. The real reference is “downstream, no human pressure”."},
  bulGlob:{fr:"Ponte globale (case décochée) : tous les œufs forment un stock commun réparti sur tout le tronçon selon les frayères ; quand l'aval perd ses adultes, l'amont reçoit aussi moins d'œufs et baisse presque autant que l'aval.",en:"Global spawning (box unticked): all eggs form one common stock spread over the whole reach according to the spawning grounds; when the downstream part loses its adults, the upstream part also receives fewer eggs and drops almost as much."},
  pressLocTip:{fr:"Où sont pondus les œufs : près des adultes qui les produisent (local + migrateurs) ou en un stock commun sur tout le tronçon. Explication dans l'encadré en bas du menu.",en:"Where eggs are laid: near the adults that produce them (local + migratory) or in one common stock over the whole reach. Explained in the box at the bottom of the menu."},
  troncT2:{fr:"Courbes de densité de population sur l'ensemble de la rivière",en:"Population density curves for the whole river"},
  troncSub2:{fr:"Les 4 courbes ci-dessous comptent toute la rivière étudiée (environ 600 m, amont et aval de l'affluent ensemble) : l'amont dilue l'effet de la pression anthropique. Pour l'isoler, regarde la section « Courbes de densité en amont et en aval de l'affluent anthropisé » au-dessus.",en:"The 4 curves below count the whole studied river (about 600 m, upstream and downstream of the tributary together): the upstream part dilutes the human pressure's effect. To isolate it, see the “Density curves upstream and downstream” section above."},
  troncSub3:{fr:"Les 4 courbes ci-dessous comptent toute la rivière étudiée (environ 600 m, tous les tronçons ensemble).",en:"The 4 curves below count the whole studied river (about 600 m, all reaches together)."},
  tabT:{fr:"Bilan chiffré sur l'ensemble de la rivière",en:"Summary for the whole river"},
  tabSub:{fr:"Moyenne des 20 dernières années sur {n} simulations (autant d'histoires de crues et de débits). Adultes par 100 m de rivière (truite fario de 2 ans et plus). Extinctions : simulations où il reste moins d'une truite fario adulte à l'année 50.",en:"Mean of the last 20 years over {n} simulations (as many flood and flow histories). Adults per 100 m of river (brown trout aged 2 and over). Extinctions: simulations with fewer than one adult brown trout left at year 50."},
  avIntro:{fr:"Compare, de part et d'autre de l'affluent, la même rivière avec et sans la pression anthropique choisie.",en:"Compares, on either side of the tributary, the same river with and without the selected human pressure."},
  avTabT:{fr:"Bilan chiffré en amont et en aval de l'affluent anthropisé",en:"Summary upstream and downstream of the human-impacted tributary"},
  avTabSub:{fr:"Individus par 100 m. « Aval sans » et « Aval avec » : sans et avec la pression anthropique choisie. « Écart » : effet de cette pression sur l'aval.",en:"Individuals per 100 m. “Down. without” and “Down. with”: without and with the selected human pressure. “Gap”: effect of that pressure on the downstream part."},
  avHS:{fr:"Aval sans",en:"Down. without"},
  avHA:{fr:"Aval avec",en:"Down. with"},

  tabSubP:{fr:"La pression anthropique choisie est comprise (amont et aval confondus).",en:"The selected human pressure is included (upstream and downstream together)."},
  flowInfo:{fr:"Chaque année simulée tire au hasard un régime de débits par saison et d'éventuelles crues. Les simulations font des tirages différents : c'est la bande autour du trait.\n• Crues fortes (probabilité par an) : printemps 15 %, automne 20 %, hiver 25 %. Hiver : 15 à 60 % des œufs détruits selon la force de la crue (ordre de grandeur d'après Sources I2). Printemps : jusqu'à 35 % des 0+ emportés. Automne : aucun effet direct dans le modèle.\n• Débits (médiane, relative à l'étiage) : printemps 2,2 ; été 1,0 ; automne 1,6 ; hiver 3,0, avec une variation d'une année à l'autre dont 60 % est commune aux 4 saisons (année sèche ou humide). Le débit change la surface d'habitat utile de chaque stade (profondeur, vitesse) et, en été, la température : un débit faible réchauffe l'eau (jusqu'à +1,3 °C).\nValeurs : ordres de grandeur du modèle [M].",
   en:"Each simulated year randomly draws seasonal flows and possible floods. The simulations use different draws: that is the band around the line.\n• Strong floods (probability per year): spring 15%, autumn 20%, winter 25%. Winter: 15 to 60% of eggs destroyed depending on flood strength (order of magnitude from Sources I2). Spring: up to 35% of 0+ washed out. Autumn: no direct effect in the model.\n• Flows (median, relative to low flow): spring 2.2; summer 1.0; autumn 1.6; winter 3.0, with year-to-year variation of which 60% is shared by all 4 seasons (dry or wet year). Flow changes the useful habitat area of each stage (depth, velocity) and, in summer, temperature: low flow warms the water (up to +1.3 °C).\nValues: model orders of magnitude [M]."},
  popSame:{fr:"Même nombre de pêcheurs avec et sans lâcher (choix de l'auteur).",en:"Same number of anglers with and without stocking (author's choice)."},
  pechT:{fr:"Pêche et déversement",en:"Angling and stocking"},
  netLab:{fr:"Rivière ouverte sur le réseau",en:"River open to the network"},
  infoMenu:{fr:"Sources et informations",en:"Sources and information"},
  iLire:{fr:"ⓘ Lire les courbes et le tableau",en:"ⓘ Reading the curves and the table"},
  iLireT:{fr:"• Chaque simulation dure 50 ans. Les 10 simulations (« graines ») sont 10 histoires différentes de crues et de débits, tirées au hasard sur la même rivière ; avec et sans lâcher, ce sont les mêmes tirages.\n• Courbes : trait = moyenne des simulations, bande = de la plus basse à la plus haute. Individus par 100 m de rivière.\n• Les 4 courbes comptent toute la rivière étudiée (environ 600 m, tous les tronçons ensemble).\n• Tableau : moyenne des 20 dernières années. Extinction : simulation où il reste moins d'une truite fario adulte à l'année 50.\n• Avec une pression anthropique, la section « Courbes de densité en amont et en aval de l'affluent anthropisé » compare l'aval avec et sans cette pression.",
   en:"• Each simulation lasts 50 years. The 10 simulations (“seeds”) are 10 different histories of floods and flows, drawn at random on the same river; with and without stocking, the draws are identical.\n• Curves: line = mean of simulations, band = lowest to highest. Individuals per 100 m of river.\n• The 4 curves count the whole studied river (about 600 m, all reaches together).\n• Table: mean of the last 20 years. Extinction: simulation with fewer than one adult brown trout left at year 50.\n• With a human pressure, the “Density curves upstream and downstream of the human-impacted tributary” section compares the downstream part with and without that pressure."},
  iTemp:{fr:"ⓘ Température de l'eau : ombre, contexte, climat",en:"ⓘ Water temperature: shade, setting, climate"},
  iTempT:{fr:"Température d'été d'un tronçon = base + ombre + débit + contexte + réchauffement climatique.\n• Base (tronçon totalement ombragé, piémont) : printemps 8,5, été 14,5, automne 9,5, hiver 4,5 °C [M, calée sur les sondes de Haute-Savoie, Sources P10]. Pointe d'une semaine chaude : +2 °C.\n• Ombre : sans ombre, l'été gagne 1,5 °C en moyenne et 0,9 °C de plus à la pointe, soit +2,4 °C entre ombre totale et aucune ombre (la littérature donne 1,5 à 5 °C sur le maximum instantané, Sources AE1 à AE3).\n• Débit : un été sec réchauffe jusqu'à +1,3 °C, un été de forts débits refroidit jusqu'à 0,8 °C.\n• Contexte thermique : −2,0 (montagne froide), 0 (piémont), +2,3 °C (plaine chaude) [M, d'après P10].\n• Réchauffement climatique : 0 à +4 °C, progressif sur 50 ans, ajouté à tout le reste.\n• Seuils de la truite fario : stress dès 19,5 °C de pic d'été, mortalité croissante jusqu'à 25 °C, limite létale à 7 jours [V, Environment Agency, Sources L1]. La forme de la mortalité entre les deux est un choix du modèle [M].\nPiémont à +0 °C : même sans ombre, le pic reste à 18,9 °C, sous le seuil, donc l'ombre ne change pas la survie. Plaine chaude à +2 °C : survie d'été 0,86 sous ombre totale, 0,25 sans ombre.",
   en:"Summer temperature of a reach = base + shade + flow + setting + climate warming.\n• Base (fully shaded reach, foothills): spring 8.5, summer 14.5, autumn 9.5, winter 4.5 °C [M, calibrated on the Haute-Savoie probes, Sources P10]. Hot-week peak: +2 °C.\n• Shade: with no shade, summer gains 1.5 °C on average and 0.9 °C more at the peak, i.e. +2.4 °C between full shade and none (literature gives 1.5 to 5 °C on the instantaneous maximum, Sources AE1 to AE3).\n• Flow: a dry summer warms up to +1.3 °C, a high-flow summer cools up to 0.8 °C.\n• Thermal setting: −2.0 (cold mountain), 0 (foothills), +2.3 °C (warm lowland) [M, from P10].\n• Climate warming: 0 to +4 °C, gradual over 50 years, added to everything else.\n• Brown trout thresholds: stress from a 19.5 °C summer peak, mortality rising up to 25 °C, 7-day lethal limit [V, Environment Agency, Sources L1]. The shape of mortality in between is a model choice [M].\nFoothills at +0 °C: even with no shade the peak stays at 18.9 °C, below the threshold, so shade does not change survival. Warm lowland at +2 °C: summer survival 0.86 under full shade, 0.25 with none."},
  iFlow:{fr:"ⓘ Crues et débits",en:"ⓘ Floods and flows"},
  iHab:{fr:"ⓘ Habitat : facteurs, interactions et effets",en:"ⓘ Habitat: factors, interactions and effects"},
  iSurv:{fr:"ⓘ Cycle de vie et survie de la truite fario",en:"ⓘ Brown trout life cycle and survival"},
  iSurvT:{fr:"• Quatre stades : œuf, 0+ (de l'année), 1+, adulte (2 ans et plus), un pas par saison.\n• Ponte en hiver : environ 600 œufs par femelle de 0,3 kg (2000 œufs par kg [O], poids [M]) ; 85 % des adultes se reproduisent, 50 % de femelles [M].\n• Survie : œufs jusqu'à l'émergence 0,5 [O, plage 0,1 à 0,86] ; 0+ en été 0,25 [M] ; 1+ et adultes 0,40 par an [V, plage 0,30 à 0,50].\n• Avec « Survie liée à l'habitat » : la survie des 1+ et adultes varie de 0,30 à 0,50 et celle des 0+ en hiver de 0,15 à 0,35 selon l'indice de refuge (bois mort, blocs, herbiers, eau profonde). Sans refuge, on est au minimum de ces plages.\n• La capacité d'habitat limite les 0+ en été et les 1+ et adultes à l'automne (loi de Beverton-Holt).\n• La température d'été agit en plus sur la survie d'été (voir Température).",
   en:"• Four stages: egg, 0+ (young of the year), 1+, adult (2 years and older), one step per season.\n• Winter spawning: about 600 eggs per 0.3 kg female (2000 eggs per kg [O], weight [M]); 85% of adults breed, 50% females [M].\n• Survival: eggs to emergence 0.5 [O, range 0.1 to 0.86]; 0+ in summer 0.25 [M]; 1+ and adults 0.40 per year [V, range 0.30 to 0.50].\n• With “Habitat-dependent survival”: survival of 1+ and adults varies from 0.30 to 0.50 and of 0+ in winter from 0.15 to 0.35 with the shelter index (deadwood, boulders, aquatic beds, deep water). With no shelter, values sit at the lower end of these ranges.\n• Habitat capacity limits 0+ in summer and 1+ and adults in autumn (Beverton-Holt law).\n• Summer temperature acts on summer survival as well (see Temperature)."},
  iNet:{fr:"ⓘ Rivière ouverte et échanges de 0+",en:"ⓘ Open river and 0+ exchange"},
  iNetT:{fr:"La rivière étudiée n'est ni la première ni la dernière d'un réseau.\n• Le cours d'eau continue à l'identique au-delà des deux bords, avec une source amont à 50 % de la capacité [M].\n• Chaque année, 27,5 % des 0+ partent vers l'aval (valeur centrale de 20 à 35 %, Sources Q2).\n• Il en arrive d'amont 70 % du nombre de départs, donc la perte nette est de 30 % des départs [M, sans source].\n• La remontée d'adultes est désactivée : pas assez de données.",
   en:"The studied river is neither the first nor the last of a network.\n• The river continues identically beyond both edges, with an upstream source at 50% of capacity [M].\n• Each year, 27.5% of 0+ leave downstream (central value of 20 to 35%, Sources Q2).\n• 70% of that number arrive from upstream, so net loss is 30% of departures [M, no source].\n• Adult upstream runs are switched off: not enough data."},
  iPech:{fr:"ⓘ Pêche et déversement",en:"ⓘ Angling and stocking"},
  iPechT:{fr:"• Pêche : chaque année, 65 % des truites fario capturables sont prélevés avant la ponte [O, Brevenne, Rhône : 60 à 65 % des adultes conservés par an] ; capturables = 50 % des adultes [M, sans source]. Les 0+ et 1+ ne sont pas touchés.\n• Déversement : 30 portions par km et par an [O, Pays du Perche, Sources T1], arc-en-ciel stériles ; 90 % prises ou perdues dans la saison [O], 30 % des survivantes gardées [M]. Suivies à part des sauvages.\n• Hypothèse du modèle : même nombre de pêcheurs avec et sans lâcher ; une partie de la pêche se détourne sur les portions, et la concurrence sur les 0+ de truite fario est faible. Ce n'est pas un résultat démontré (Sources V, X, Y).",
   en:"• Angling: each year, 65% of catchable brown trout are taken before spawning [O, Brevenne, Rhône: 60 to 65% of adults kept per year]; catchable = 50% of adults [M, no source]. 0+ and 1+ are not affected.\n• Stocking: 30 catchable fish per km per year [O, Pays du Perche, Sources T1], sterile rainbow trout; 90% taken or lost within the season [O], 30% of survivors kept [M]. Tracked separately from wild fish.\n• Model assumption: same number of anglers with and without stocking; part of the angling shifts to stocked fish, and competition on brown trout 0+ is weak. This is not a demonstrated result (Sources V, X, Y)."},
  iPress:{fr:"ⓘ Pressions anthropiques",en:"ⓘ Human pressures"},
  iEsp:{fr:"ⓘ Espèces associées : chabot, vairon, écrevisse",en:"ⓘ Associated species: bullhead, minnow, crayfish"},
  iEspT:{fr:"Chabot, vairon et chevesne sont toujours simulés ; leurs adultes sont dans le tableau. Le chevesne n'apparaît qu'avec le réchauffement (eau de printemps au-dessus de 12 °C environ [V, Sources AG1]) et remonte la rivière si elle est ouverte. Deux réglages, dans « Espèces » (désactivés par défaut) :\n• Prédation de la truite fario sur chabot et vairon : réduit leur survie d'été avec la densité de truite fario (coefficients 0,05 et 0,10 [M], Sources L4, L5).\n• Écrevisse signal (introduite) : un front remonte la rivière ; il réduit la survie d'été des chabots (coefficient 0,6) et des 0+ de truite fario (0,2) [M, Sources L7].",
   en:"Bullhead, minnow and chub are always simulated; their adults are in the table. Chub only appears with warming (spring water above about 12 °C [V, Sources AG1]) and moves up the river if it is open. Two settings, in “Species” (off by default):\n• Brown trout predation on bullhead and minnow: reduces their summer survival with brown trout density (coefficients 0.05 and 0.10 [M], Sources L4, L5).\n• Signal crayfish (introduced): a front moves up the river; it reduces summer survival of bullheads (coefficient 0.6) and brown trout 0+ (0.2) [M, Sources L7]."},
  iSrc:{fr:"ⓘ Sources et statuts des valeurs",en:"ⓘ Sources and status of values"},
  iSrcT:{fr:"Chaque valeur du modèle a un statut : [V] lue dans une source, [O] ordre de grandeur tiré d'une source indirecte (autre espèce ou autre rivière), [M] choix du modèle, sans source.\nLe détail est dans Sources_Riviere.txt : température et ombre (AE, M3), pressions (AD), habitat et survie (AB, AC), crues (I2), seuils thermiques (L1).\nLes résultats sont des ordres de grandeur du modèle, pas des prédictions.",
   en:"Each model value has a status: [V] read in a source, [O] order of magnitude from an indirect source (other species or river), [M] model choice, no source.\nDetails are in Sources_Riviere.txt: temperature and shade (AE, M3), pressures (AD), habitat and survival (AB, AC), floods (I2), thermal thresholds (L1).\nResults are model orders of magnitude, not predictions."},
  netNote:{fr:"Entrées et sorties amont et aval, échanges de 0+ : départs vers l'aval 27,5 %, arrivées d'amont 70 % des départs.",en:"Upstream and downstream in and out, 0+ exchange: downstream departures 27.5%, arrivals from upstream 70% of departures."}
};

    f:{fr:["Rôle : abri, poste de chasse","Effet : remous, brassage de l'eau","Habitat : invertébrés sous les pierres","Tailles : galets, blocs, gros blocs (modèle)"],en:["Role: shelter, feeding station","Effect: eddies, water mixing","Habitat: invertebrates under stones","Sizes: cobbles, boulders, large boulders (model)"]}},
  herbier:{c:"#6fbf73",n:{fr:"Herbier de renoncules",en:"Water-crowfoot bed"},
    d:{fr:"Plantes aquatiques fixées au fond, dont les tiges souples ondulent dans le courant. Ici : des renoncules, avec des mousses sur les blocs.",en:"Rooted aquatic plants whose flexible stems wave in the current. Here: water-crowfoot, with mosses on the boulders."},
    m:{fr:"Les renoncules (renoncule peltée, renoncule en pinceau) forment des herbiers dans des cours d'eau plutôt courants et permanents. Ils ne forment de gros herbiers qu'en zone ensoleillée : l'ombrage les limite, alors que l'absence totale d'ombrage peut les faire proliférer. Les mousses (Fontinalis) se fixent sur les pierres en eau rapide.",
       en:"Water-crowfoots (pond and stream water-crowfoot) form beds in fairly fast, permanent streams. They only form large beds in sunlit areas: shade limits them, whereas a total lack of shade can make them proliferate. Mosses (Fontinalis) attach to stones in fast water."},
    f:{fr:["Où : radiers et plats courants peu profonds","Lumière : seulement en zone ensoleillée","Mousses : sur les blocs en eau rapide, surtout à l'ombre","Modèle : seuils de profondeur, courant et lumière = ordres de grandeur non vérifiés"],
       en:["Where: shallow riffles and fast flats","Light: only in sunlit areas","Mosses: on boulders in fast water, mostly in shade","Model: depth, current and light thresholds are unverified orders of magnitude"]}},
  litMajeur:{c:"#c7d36b",n:{fr:"Lit majeur",en:"Floodplain"},
    d:{fr:"Fond de vallée plat que la rivière envahit lors des crues, au-delà de ses berges. Il est bordé ici par un talus puis par les versants.",
       en:"Flat valley floor that the river floods beyond its banks. Here it is bordered by a bank, then by the valley sides."},
    m:{fr:"Quand le débit dépasse ce que le lit mineur peut contenir, l'eau déborde, ralentit et dépose des limons. Les prairies inondables et les bras morts servent de zones de frai et de refuge à certaines espèces, comme le brochet. Utilisez le curseur « Crue » pour l'inonder.",
       en:"When the flow exceeds what the main channel can hold, water spills over, slows down and drops silt. Flooded meadows and oxbows serve as spawning and refuge areas for some species, such as pike. Use the 'Flood' slider to flood it."},
    f:{fr:["Inondé : lors des crues","Dépôts : limons","Rôle : expansion des crues, frayères (brochet)"],en:["Flooded: during floods","Deposits: silt","Role: flood storage, spawning (pike)"]}}
};

/* =====================================================================
   4. HYDRO : geometrie PURE du troncon (aucun objet 3D ici)
   x = sens du courant (amont -> aval), z = lateral, y = altitude.
   makeHydro(graine) -> axe du lit, height(x,z), ilots, rochers.
   ===================================================================== */
const RVBIG={chance:0.3,f:1.6,cap:1.25,poolGap:[45,60],poolR:[0.55,1.1]};   /* ABRIS1 : gros blocs. chance = part des gros blocs de riviere rendus plus gros (x f, jusqu'au rayon cap) ; poolGap = distance mini et aleatoire entre deux blocs de MOUILLE (m) ; poolR = rayon mini et maxi (m) */
function makeHydro(seed){
  const R=CFG.reach,T=CFG.terrain,V=CFG.valley;
  let st=(seed>>>0)||1;
  const rnd=()=>{st=(st+0x6D2B79F5)|0;let q=Math.imul(st^(st>>>15),1|st);q=(q+Math.imul(q^(q>>>7),61|q))^q;return ((q^(q>>>14))>>>0)/4294967296;};
  const so=Math.floor(rnd()*10000);
  function hash(ix,iy){let h=(Math.imul(ix+so,374761393)+Math.imul(iy-so,668265263))|0;
    h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
  function noise(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
    const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
    const a=hash(ix,iy),b=hash(ix+1,iy),c=hash(ix,iy+1),d=hash(ix+1,iy+1);
    return a+(b-a)*ux+(c-a)*uy+(a-b-c+d)*ux*uy;}
  function fbm(x,y){let s=0,a=0.5;for(let o=0;o<4;o++){s+=a*noise(x,y);x=x*2.03+17.1;y=y*2.03+9.2;a*=0.5;}return s/0.9375;}
  const ss=(a,b,x)=>{let u=(x-a)/(b-a);u=u<0?0:u>1?1:u;return u*u*(3-2*u);};
  const lam=R.W*R.lambdaW;
  const zv=x=>V.axisAmp*Math.sin(x/V.axisLen+so*0.001);             // axe de la vallee
  const fw=x=>V.fpHalf*(0.85+0.3*fbm(x/120+11.3,so*0.01));           // demi-largeur du lit majeur

  // 1) Axe du lit : on "marche" en tournant la direction (angle th).
  //    Chaque demi-meandre a sa propre longueur et son propre angle -> irregulier.
  const ds=0.5,xS=-T.X/2-80,xE=T.X/2+80,ax=[],az=[],ath=[];
  const ph1=so*0.0173,ph2=so*0.0311;                                              /* ligne que la riviere suit en moyenne */
  const zt=xx=>zv(xx)+R.wander*(0.55*Math.sin(xx/R.wlen+ph1)+0.45*Math.sin(xx/(R.wlen*0.43)+ph2));
  const dzt=xx=>(zt(xx+1)-zt(xx-1))/2;
  const half=(sv)=>{   /* regime de sinuosite lent (bruit le long du lit) ; meme nombre d'appels a rnd */
    if(R.regles){   /* sinuosite irreguliere : tronçons presque droits (radiers, plats) et tronçons sinueux (rayon >= rcMin largeurs) */
      const rl=rnd(),ra=rnd(),rb=rnd(),w=R.W;
      const gs=Math.max(-1,Math.min(1,(fbm(sv/220,so*0.19+3)-0.5)*6+0.3));   // -1 : droit ... +1 : tres sinueux
      const ang=gs>-0.2&&fbm(sv/230,so*0.23+41)>R.angSeuil;
      let len=w*(R.lamMin+(R.lamMax-R.lamMin)*rl)/2;                              // demi-meandre = lambda/2
      if(gs<0)len*=1-0.8*gs;else len*=1-0.2*gs;
      if(gs>0&&rb<R.petit)len*=0.6;                                               // petits meandres serres
      let rc=w*(R.rcMin+(R.rcMax-R.rcMin)*ra);                                    // rayon au sommet voulu
      if(gs<0)rc*=1-3*gs;                                                         // tronçon droit : virages tres doux
      return {len:len,amp:Math.min(1.2,len/(Math.PI*rc*(ang?1.9:1))),ang:ang};
    }
    const rl=rnd(),ra=rnd();
    let len=lam/2*(0.6+0.8*rl),amp=R.thetaMin+(R.thetaMax-R.thetaMin)*Math.pow(ra,0.8);
    const rg=Math.max(-1,Math.min(1,(fbm(sv/300,so*0.19+3)-0.5)*6))*(R.variete||0);
    if(rg>0){amp*=1+0.4*rg;len*=1-0.25*rg;}else{amp*=1+0.7*rg;len*=1-0.4*rg;}
    amp=Math.min(1.12,amp);
    const ang=(R.variete||0)>0&&fbm(sv/230,so*0.23+41)>0.58;   /* coude anguleux = droit puis virage serre */
    if(ang)amp=Math.min(amp,0.9);   // les coudes anguleux restent moderes (evite de sortir du lit majeur)
    len=Math.max(len,amp*Math.PI*1.05*R.W*(ang?2:1));   // rayon de courbure mini : evite les meandres qui se recoupent
    return {len:len,amp:amp,ang:ang};
  };
  let x=xS,z=zt(xS),s=0,hs=0,sign=rnd()<0.5?1:-1,hf=half(s);
  while(x<xE){
    let th=sign*hf.amp*(hf.ang?Math.tanh(1.8*Math.sin(Math.PI*hs/hf.len))/0.947:Math.sin(Math.PI*hs/hf.len))+0.16*(fbm(s/35,so*0.37)-0.5)-R.restore*(z-zt(x))+(R.regles?dzt(x):0);
    th=th<-1.2?-1.2:th>1.2?1.2:th;
    ax.push(x);az.push(z);ath.push(th);
    x+=Math.cos(th)*ds;z+=Math.sin(th)*ds;s+=ds;hs+=ds;
    if(hs>=hf.len){hs-=hf.len;hf=half(s);sign=-sign;}
  }
  const N=ax.length,F=()=>new Float32Array(N);
  const X=F(),Zc=F(),NX=F(),NZ=F(),K=F(),S=F(),P=F(),VP=F(),WL=F(),HW=F(),D=F(),WM=F();
  for(let i=0;i<N;i++){X[i]=ax[i];Zc[i]=az[i];NX[i]=-Math.sin(ath[i]);NZ[i]=Math.cos(ath[i]);S[i]=i*ds;}
  for(let i=1;i<N-1;i++)K[i]=(ath[i+1]-ath[i-1])/(2*ds);
  const Ks=F();
  for(let i=0;i<N;i++){let a=0,n=0;for(let j=i-10;j<=i+10;j++)if(j>=0&&j<N){a+=K[j];n++;}Ks[i]=a/n;}
  // Table x -> indice de l'axe (x croit toujours le long de l'axe)
  const LUT=new Int32Array(Math.ceil((xE-xS)/0.5)+3);
  for(let c=0,j=0;c<LUT.length;c++){const xc=xS+c*0.5;while(j<N-1&&X[j+1]<=xc)j++;LUT[c]=j;}
  const idx=xx=>{let c=Math.round((xx-xS)/0.5);c=c<0?0:c>=LUT.length?LUT.length-1:c;return LUT[c];};

  // 2) Mouilles : dans les courbes (courbure) + en ligne droite (rythme ~6,5 largeurs).
  //    VP = position laterale signee du point le plus profond (vers la rive exterieure).
  let kmax=0;for(let i=0;i<N;i++)kmax=Math.max(kmax,Math.abs(Ks[i]));
  const kref=kmax*0.75,sh=Math.round(R.poolShift*lam/ds);let phb=rnd()*6.28;
  const KW=F(),wn=Math.round(3*R.W/ds);   /* courbure max a +-3 largeurs (pas de mouille "droite" a cote d'un coude) */
  for(let i=0;i<N;i++){let m=0;for(let j=Math.max(0,i-wn);j<=Math.min(N-1,i+wn);j+=4)m=Math.max(m,Math.abs(Ks[j]));KW[i]=m;}
  for(let i=0;i<N;i++){
    const kc=Ks[Math.max(0,i-sh)],pc=ss(0.4,0.95,Math.abs(kc)/kref);
    phb+=ds*2*Math.PI/(R.poolSpacingW*R.W*(0.8+0.4*fbm(S[i]/60,so*0.21+5))*(1+0.5*(R.variete||0)*(2*fbm(S[i]/200,so*0.17+31)-1)));   
    const ps=ss(0.5,1,Math.sin(phb))*(0.75+0.2*(R.variete||0)),   /* mouilles plus marquees aussi en ligne droite */
        os=Math.sin(phb*0.5)>=0?1:-1;
    const wc=ss(0.08,0.35,pc),pS=ps*(1-wc)*(R.regles?1-ss(0.35,0.7,KW[i]/kref):1),oc=kc>=0?-1:1;
    P[i]=Math.max(pc,pS);
    VP[i]=0.5*(pc*oc+pS*os);
    D[i]=R.depthRiffle*(0.8+0.4*fbm(S[i]/40,so*0.5+9))+(R.depthPool-R.depthRiffle)*P[i]*(0.65+0.7*fbm(S[i]/90,so*0.3+3));
    HW[i]=R.W/2*(0.78+0.44*fbm(S[i]/70,so*0.13+1))*(1+0.15*(1-P[i]));
    {/* resserrements (jusqu'a ~0,7 x) et zones larges (jusqu'a ~1,25 x) ; mouilles de profondeur inegale */
      const V1=R.variete||0,cl=x=>x<-1?-1:x>1?1:x;
      const gw=cl((fbm(S[i]/150,so*0.29+13)-0.5)*3.4),gd=cl((fbm(S[i]/220,so*0.41+21)-0.5)*3.4);
      WM[i]=Math.max(0.7,Math.min(1.25,1+(gw<0?0.40:0.30)*gw*V1));HW[i]*=WM[i];
      const pm=1+V1*(gd>0?1.0:0.25)*gd+0.35*V1;   /* mouilles plus profondes, quelques-unes tres profondes */
      D[i]=Math.min(R.depthPool*2.0,D[i]*(1+(pm-1)*P[i]));
    }
  }
  // 3) Ilots : sur des zones larges et peu profondes ; le lit s'elargit autour
  const ISL=[],nI=R.islandEvery>=1e8?0:Math.max(1,Math.round(T.X/R.islandEvery));
  for(let tr=0;tr<120&&ISL.length<nI;tr++){
    const i=idx((rnd()-0.5)*(T.X-90));
    if(P[i]>0.3||WM[i]<0.9||ISL.some(o=>Math.abs(o.s-S[i])<100))continue;   
    ISL.push({s:S[i],i,a:(8+8*rnd())*0.75,b:(2+1.6*rnd())*0.75,lat:(rnd()-0.5)*2,h:0.3+0.35*rnd()});
  }
  for(const o of ISL)for(let i=0;i<N;i++){const d=Math.abs(S[i]-o.s)/(o.a*1.7);if(d<1)HW[i]+=o.b*1.5*(0.5+0.5*Math.cos(Math.PI*d));}
  for(const o of ISL)for(let i=0;i<N;i++){const d=Math.abs(S[i]-o.s)/(o.a*1.7);if(d<1)D[i]*=1-0.4*(0.5+0.5*Math.cos(Math.PI*d));}   /* lit moins profond le long de l'ilot */
  // 4) Ligne d'eau en marches : forte pente sur les radiers, presque plate en mouille
  const tmp=new Float64Array(N);
  for(let i=1;i<N;i++)tmp[i]=tmp[i-1]-ds*(0.25+1.5*(1-P[i]));
  const sc=R.slope*S[N-1]/(-tmp[N-1]),mid=tmp[idx(0)]*sc;
  for(let i=0;i<N;i++)WL[i]=tmp[i]*sc-mid;

  // Point de l'axe le plus proche de (x,z)
  const Q={i:0,lat:0,wl:0,p:0,outer:0,zone:0,isl:0,ter:0,fp:0};
  function query(xx,zz){
    const c=idx(xx);let best=1e18,bi=c;
    const a=Math.max(0,c-150),b=Math.min(N-1,c+150);
    for(let i=a;i<=b;i+=3){const dx=xx-X[i],dz=zz-Zc[i],d=dx*dx+dz*dz;if(d<best){best=d;bi=i;}}
    const a2=Math.max(0,bi-3),b2=Math.min(N-1,bi+3);
    for(let i=a2;i<=b2;i++){const dx=xx-X[i],dz=zz-Zc[i],d=dx*dx+dz*dz;if(d<best){best=d;bi=i;}}
    Q.i=bi;Q.lat=(xx-X[bi])*NX[bi]+(zz-Zc[bi])*NZ[bi];return Q;
  }
  // Altitude du sol : lit mineur, berges, ilots, lit majeur, talus, versants
  function height(xx,zz){
    query(xx,zz);
    const i=Q.i,lat=Q.lat,wl=WL[i],hw=HW[i],vp=VP[i],a=Math.min(1,Math.abs(vp)*2),al=Math.abs(lat),s0=S[i];
    Q.wl=wl;Q.p=P[i];Q.outer=lat*vp>0?a:-a;Q.isl=0;
    let h;
    if(al<=hw){
      const v=lat/hw,tt=v>vp?(v-vp)/(1-vp):(vp-v)/(1+vp),f=Math.max(0,1-tt*tt);
      const rough=(fbm(xx*0.5,zz*0.5)-0.5)*0.16*(1-0.5*P[i]);
      h=wl-0.06-D[i]*Math.pow(f,1.25)+rough*f;Q.zone=0;
    }else{
      const e=al-hw,outer=lat*vp>0,bw=outer?2.4-0.9*a:2.4+8.6*a;
      let u=Math.min(1,e/bw);u=outer?u*u*(3-2*u):Math.pow(u,1.5);
      const hb=R.bankH*(0.85+0.3*fbm(xx*0.03+7,zz*0.03));
      h=wl-0.06+(hb+0.06)*u+(fbm(xx*0.025,zz*0.025)-0.5)*0.8*Math.min(1,e/18);
      Q.zone=1;
    }
    for(const o of ISL){
      const u=(s0-o.s)/o.a;if(u>1.6||u<-1.6)continue;
      const w=(lat-o.lat)/o.b,r=Math.sqrt(u*u+w*w);
      if(r<1.6){const top=wl+o.h+(fbm(xx*0.4,zz*0.4)-0.5)*0.15,bs=Math.min(h,wl-0.35),hi=bs+(top-bs)*(1-ss(0.3,1.6,r));   /* flanc continu avec le lit */
        if(hi>h)h=hi;Q.isl=Math.max(Q.isl,1-ss(0.5,1.2,r));}
    }
    const dv=Math.abs(zz-zv(xx)),FW=fw(xx);Q.fp=dv/FW;Q.ter=0;
    if(dv>FW){const k=dv-FW;h+=V.terraceH*ss(0,V.terraceW,k)+(k>V.terraceW?Math.pow(k-V.terraceW,1.35)*V.hillRise:0);Q.ter=ss(0,V.terraceW,k);}
    return h;
  }
  function pointAt(fi,lat,out){
    const i=Math.max(0,Math.min(N-2,Math.floor(fi))),f=Math.min(1,Math.max(0,fi-i));
    const m=A=>A[i]+(A[i+1]-A[i])*f;
    out.x=m(X)+m(NX)*lat;out.z=m(Zc)+m(NZ)*lat;out.y=m(WL);return out;
  }
  // 5) Rochers : granulometrie variee
  //    cls 0 = galets (nombreux sur les radiers), 1 = blocs, 2 = gros blocs qui partagent le courant
  const ROCKS=[],RVH=[0.78,0.92,0.66,1.05,0.84];   // hauteur relative de chaque forme
  function addRock(xx,zz,r,cls){
    const v=Math.floor(rnd()*5);let b=height(xx,zz);const i=Q.i,wl=Q.wl,inCh=Q.zone===0;
    for(let k=0;k<4;k++){const a=k*1.571+0.4;b=Math.min(b,height(xx+Math.cos(a)*r*0.7,zz+Math.sin(a)*r*0.7));}
    let y;
    if(cls===2&&inCh){const e=0.35+0.6*rnd();               // les gros blocs du lit depassent de l'eau
      r=Math.min(RVBIG.cap,Math.max(r,(wl+e-b)/(RVH[v]*0.8)));y=Math.min(b-r*RVH[v]*0.15,wl+e-r*RVH[v]);}
    else y=b-r*RVH[v]*(cls===0?0.35:0.2+0.15*rnd());
    const top=y+r*RVH[v];
    ROCKS.push({x:xx,y,z:zz,r,v,cls,top,rot:rnd()*6.283,tilt:(rnd()-0.5)*(cls===0?0.6:0.3),
      em:top>wl+0.03,gap:wl-top,wl,inCh,tx:NZ[i],tz:-NX[i]});
  }
  const iA=idx(-T.X/2+5),iB=idx(T.X/2-5);
  for(let i=iA;i<iB;i+=2){
    const nc=Math.floor(rnd()*R.rockDensity*9*(0.15+0.85*(1-P[i])));          // galets
    for(let k=0;k<nc;k++){const lat=(rnd()*2-1)*HW[i]*0.95;
      addRock(X[i]+NX[i]*lat+(rnd()-0.5),Zc[i]+NZ[i]*lat+(rnd()-0.5),(0.07+0.2*Math.pow(rnd(),1.4))*0.8,0);}   /* galets x0,8 */
    if(rnd()<R.rockDensity*(0.12+0.88*(1-P[i]))*0.4){   /* plus de blocs dans les radiers */                           // blocs, seuls ou en groupes
      const n=rnd()<0.3?2+Math.floor(rnd()*3):1,lat0=(rnd()*2-1)*HW[i]*0.85;
      for(let k=0;k<n;k++){const lat=lat0+(rnd()-0.5)*3;
        addRock(X[i]+NX[i]*lat+(rnd()-0.5)*3,Zc[i]+NZ[i]*lat+(rnd()-0.5)*3,(0.3+0.9*Math.pow(rnd(),1.8))*0.55,1);}
    }
  }
  const rvRb=(()=>{let a=(Math.imul(seed>>>0,2654435761)^0x9E3779B9)>>>0||1;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};})();   // ABRIS1 : generateur a part (les autres rochers ne bougent pas)
  let nextBig=S[iA]+30+rnd()*60;                                                  // gros blocs (1,4 a 2,8 m)
  for(let i=iA;i<iB;i++){
    if(S[i]<nextBig||P[i]>0.45)continue;nextBig=S[i]+70+rnd()*80;
    if(ISL.some(o=>Math.abs(o.s-S[i])<o.a*2))continue;
    const lat=(rnd()-0.5)*HW[i]*0.7;addRock(X[i]+NX[i]*lat,Zc[i]+NZ[i]*lat,(0.45+0.35*rnd())*(rvRb()<RVBIG.chance?RVBIG.f:1),2);
    if(rnd()<0.5){const l2=lat+(rnd()<0.5?-1:1)*(2.5+rnd()*2);addRock(X[i]+NX[i]*l2+(rnd()-0.5)*4,Zc[i]+NZ[i]*l2+(rnd()-0.5)*4,0.25+0.3*rnd(),1);}
  }
  {let nextP=S[iA]+20+rvRb()*40;                                                    // ABRIS1 : blocs de MOUILLE, poses sur le fond (inCh faux : pas d'ecume autour)
   for(let i=iA;i<iB;i++){
     if(S[i]<nextP||P[i]<0.5)continue;nextP=S[i]+RVBIG.poolGap[0]+rvRb()*RVBIG.poolGap[1];
     if(ISL.some(o=>Math.abs(o.s-S[i])<o.a*2))continue;
     const lat=(rvRb()-0.5)*HW[i]*0.9,xx=X[i]+NX[i]*lat,zz=Zc[i]+NZ[i]*lat,r=RVBIG.poolR[0]+(RVBIG.poolR[1]-RVBIG.poolR[0])*rvRb(),v=Math.floor(rvRb()*5);
     let b=height(xx,zz);const ii=Q.i,wl=Q.wl;
     for(let k=0;k<4;k++){const a=k*1.571+0.4;b=Math.min(b,height(xx+Math.cos(a)*r*0.7,zz+Math.sin(a)*r*0.7));}
     const y=b-r*RVH[v]*0.2,top=y+r*RVH[v];

const AFFC={

function rvSmall(seed){                   // une petite riviere : memes regles, lit plus etroit, sans ilot

function rvAffTry(H,sm,ic,side,rnd){      // pose un affluent sur le cote "side" (+1/-1) de la riviere en ic ; null si impossible

      const ie=sm.idx(xs);let ib=ie;

      let w=H.WL[ic]+AFFC.drop+AFFC.slopeMul*(sm.WL[i]-sm.WL[ie]);
      if(i<ie){
        const dx=sm.X[i]-Ex,dz=sm.Zc[i]-Ez,wx=Cx+cs*dx-sn*dz,wz=Cz+sn*dx+cs*dz;
        if(Math.abs(wz-H.zv(wx))>H.fw(wx)*0.95){
          const nx2=cs*sm.NX[i]-sn*sm.NZ[i],nz2=sn*sm.NX[i]+cs*sm.NZ[i];let g=1e9;
          for(const l of [-2.4,-1.2,0,1.2,2.4])g=Math.min(g,H.height(wx+nx2*l,wz+nz2*l));

function rvAffInstall(H){                  // enveloppe H.height : creuse le lit de chaque affluent dans le terrain

      const sm=a.sm,bi=c.bi,al=Math.abs(c.lat),hw=sm.HW[bi];if(al>hw+P.bw)continue;
      const wl=a.wl[bi-a.ib],base=wl-0.06;let prof;

function rvAffRocks(H){                    // rochers : on retire ceux du lit des affluents, on ajoute ceux des petites rivieres

    for(const rk of sm.ROCKS){
      if(rk.cls>1||rk.r>0.45)continue;
      const q=sm.query(rk.x,rk.z),bi=q.i,lat=q.lat;
      if(bi<a.ib+8||bi>a.ie-Math.round(AFFC.mouth*2.5)||Math.abs(lat)>sm.HW[bi]+1.5)continue;
      const w=a.toW(rk.x,rk.z),wl=a.wl[bi-a.ib],r2=rk.r*AFFC.kR,top=wl+(rk.top-rk.wl)*AFFC.kR;
      const tx=sm.NZ[bi],tz=-sm.NX[bi];

/* A6/A8 : pression anthropique PREVUE sur un affluent (hameau, vaches, usine). On cherche, pour chaque riviere, un emplacement dans la plaine

function rvAffPress(H){

  for(let ti=0;ti<PRT.length&&!H.PRESS;ti++){
    const T=PRT[ti],mm=T.mm;let best=null;

      if(!mainOK(x,z,r+mm)||Math.abs(z-H.zv(x))>H.fw(x)*0.85)return false;

function rvAff(H){                         // ajoute les affluents a une riviere fraichement generee (appele pour chaque graine)

      H.height=h0;H.ROCKS=rocks0.slice();H.AFF=[];

function rvPeriodicNoise(fx,fy){

function disposeObj(o){o.traverse(c=>{if(c.geometry)c.geometry.dispose();if(c.material){(Array.isArray(c.material)?c.material:[c.material]).forEach(m=>m.dispose());}});}

// Normales lissees pour une geometrie non indexee (sommets dupliques)
function smoothNormals(g){
  g.computeVertexNormals();
  const p=g.attributes.position,n=g.attributes.normal,m=new Map(),key=i=>Math.round(p.getX(i)*1e4)+","+Math.round(p.getY(i)*1e4)+","+Math.round(p.getZ(i)*1e4);
  for(let i=0;i<p.count;i++){const k=key(i),a=m.get(k)||[0,0,0];a[0]+=n.getX(i);a[1]+=n.getY(i);a[2]+=n.getZ(i);m.set(k,a);}
  for(let i=0;i<p.count;i++){const a=m.get(key(i)),l=Math.hypot(a[0],a[1],a[2])||1;n.setXYZ(i,a[0]/l,a[1]/l,a[2]/l);}
}
// Bruit GLSL (noms prefixes rv pour ne pas heurter ceux de Three.js)
const GLSL_NOISE=`
/* hachage sans sinus : evite les lignes parasites par perte de precision loin du centre */
float rvHash(vec2 p){vec3 p3=fract(vec3(p.xyx)*0.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}

  return mix(mix(rvHash(i),rvHash(i+vec2(1.0,0.0)),u.x),mix(rvHash(i+vec2(0.0,1.0)),rvHash(i+vec2(1.0,1.0)),u.x),u.y);}

const ENV={hour:10.5,sunDir:new THREE.Vector3(0,1,0),sunCol:new THREE.Color(1,1,1),
  zenith:new THREE.Color(),horizon:new THREE.Color(),ground:new THREE.Color(),fogCol:new THREE.Color(),warm:0,light:1};
const ST={flow:1,turb:0.8,foam:1,anim:1,fog:1,flood:0,time:0};
// Uniformes partages par plusieurs materiaux (mis a jour dans la boucle)
const U={time:{value:0},sunCol:{value:new THREE.Color()},caust:{value:1}};

function updateEnv(){
  // Le soleil se leve cote amont et se couche cote aval (face a la vue d'ensemble)
  const k=(ENV.hour-6)/14,el=Math.sin(Math.PI*Math.min(1,k))*0.95-0.04,az=Math.PI*k;
  const se=Math.sin(el),ce=Math.cos(el);
  ENV.sunDir.set(-Math.cos(az)*ce,se,-0.6*Math.sin(az)*ce-0.25).normalize();
  const w=1-HY.ss(0.05,0.45,se);ENV.warm=w;
  ENV.sunCol.setRGB(1,0.95-0.4*w,0.86-0.58*w);
  ENV.zenith.copy(lin(0x3b73b3)).lerp(lin(0x34508a),w);
  ENV.horizon.copy(lin(0xcddde6)).lerp(lin(0xf0b07c),w);
  ENV.ground.copy(lin(0x55613f));
  ENV.fogCol.copy(ENV.horizon).multiplyScalar(0.95);
  fog.color.copy(ENV.fogCol);
  sun.color.copy(ENV.sunCol);
  sun.intensity=(2.3-0.15*(1-w))*HY.ss(-0.03,0.25,se)+0.05;ENV.light=sun.intensity/2.35;
  hemi.color.copy(lin(0xa9c6dc)).lerp(ENV.horizon,0.3);

}
// L'ombre suit la zone regardee : nette de pres, large de loin
function updShadowFrame(){
  const d=camera.position.distanceTo(controls.target),sz=Math.max(30,Math.min(340,d*1.1)),c=sun.shadow.camera;
  if(Math.abs(sz-(sun.userData.sz||0))>0.5){c.left=-sz;c.right=sz;c.top=sz;c.bottom=-sz;c.updateProjectionMatrix();sun.userData.sz=sz;}
  sun.target.position.copy(controls.target);
  sun.position.copy(controls.target).addScaledVector(ENV.sunDir,600);
}

/* ----- Materiau d'eau commun (riviere et crue) ----- */
function makeWaterMat(c,shallow,deep){
  const u={uTime:U.time,uFlow:{value:1},uAnim:{value:1},uTurb:{value:0.8},uFoam:{value:1},uLevel:{value:0},
    uFogOn:{value:1},uFogNear:{value:c.CFG.fog.near},uFogFar:{value:c.CFG.fog.far},
    uSunDir:{value:new THREE.Vector3()},uSunCol:{value:new THREE.Color()},
    uHorizon:{value:new THREE.Color()},uZenith:{value:new THREE.Color()},uFogCol:{value:new THREE.Color()},
    uShallow:{value:c.lin(shallow)},uDeep:{value:c.lin(deep)},
    tScene:{value:null},tDepth:{value:null},uRes:{value:new THREE.Vector2(1,1)},uNear:{value:0.2},uFar:{value:6000},uRT:{value:0}};
  const M=new THREE.ShaderMaterial({uniforms:u,transparent:true,depthWrite:false,
    vertexShader:`attribute float aDepth;attribute float aSpeed;attribute vec2 aFlow;attribute float aRock;attribute float aHide;/* BLOC AJUST9 */
      uniform float uTime,uFlow,uAnim,uLevel;
      varying float vHide;varying float vDepth,vSpeed,vRock;varying vec2 vFlow;varying vec3 vWorld;
      void main(){vec3 p=position;p.y+=uLevel;
        float w=sin(aFlow.x*1.7-uTime*1.4*uFlow/*A2f*/+aFlow.y*0.9)*0.012+sin(aFlow.x*0.6+aFlow.y*2.3-uTime*1.3)*0.008;
        p.y+=w*uAnim*(0.4+aSpeed+aRock);
        vec4 wp=modelMatrix*vec4(p,1.0);vWorld=wp.xyz;vDepth=aDepth+uLevel;vSpeed=aSpeed;vFlow=aFlow;vRock=aRock;vHide=aHide;
        gl_Position=projectionMatrix*viewMatrix*wp;}`,
    fragmentShader:`#include <packing>
      uniform float uTime,uFlow,uAnim,uTurb,uFoam,uFogOn,uFogNear,uFogFar,uNear,uFar,uRT;
      uniform vec3 uSunDir,uSunCol,uHorizon,uZenith,uFogCol,uShallow,uDeep;
      uniform sampler2D tScene,tDepth;uniform vec2 uRes;
      varying float vHide;varying float vDepth,vSpeed,vRock;varying vec2 vFlow;varying vec3 vWorld;
      `+c.GLSL_NOISE+`
      vec3 rvTm(vec3 c0){
        #if defined(TONE_MAPPING)
        return toneMapping(c0);
        #else
        return c0;
        #endif
      }
      float surf(vec2 q,float sp){float t=uTime*uAnim*uFlow*0.7;
        return rvFbm(vec2(q.x*0.9-t*1.1,q.y*1.4))*0.5+rvFbm(vec2(q.x*2.3-t*1.8+3.1,q.y*2.0+t*0.15))*0.32+rvFbm(vec2(q.x*5.2-t*2.7+7.7,q.y*4.6+t*0.25))*0.18;}
      void main(){
        if(vDepth<0.0)discard;
        vec2 q=vFlow;float e=0.08,sp=vSpeed+vRock*0.5;
        float t=uTime*uAnim*uFlow*0.6;
        float rvFd=1.0-smoothstep(20.0,160.0,length(cameraPosition-vWorld));
        float h0=surf(q,sp),hx=surf(q+vec2(e,0.0),sp),hy=surf(q+vec2(0.0,e),sp);
        float amp=(0.35+0.9*sp)*0.25*mix(0.25,1.0,rvFd);
        vec3 n=normalize(vec3(-(hx-h0)/e*amp,1.0,-(hy-h0)/e*amp));
        vec3 v=normalize(cameraPosition-vWorld);
        float fres=0.02+0.98*pow(1.0-clamp(dot(n,v),0.0,1.0),5.0);
        vec3 r=reflect(-v,n);
        vec3 sky=mix(uHorizon,uZenith,clamp(r.y*1.4,0.0,1.0));
        float sd=max(dot(r,uSunDir),0.0);
        float spec=pow(sd,220.0)*2.2+pow(sd,900.0)*3.5+pow(sd,20.0)*0.06;
        float dd=max(vDepth,0.0),absorb=1.0-exp(-dd*uTurb);
        float a=max(mix(0.15,0.93,absorb),fres*0.9);
        vec3 col=mix(mix(uShallow,uDeep,absorb),sky,fres)+uSunCol*spec;
        float wz=-(viewMatrix*vec4(vWorld,1.0)).z;
        if(uRT>0.5&&gl_FrontFacing&&wz>0.3){
          /* eau realiste : le fond (scene sans l'eau) est lu a travers la surface, deforme par les rides ; epaisseur reelle = profondeur de la scene - profondeur de l'eau */
          vec2 uv=gl_FragCoord.xy/uRes;
          float sz0=-perspectiveDepthToViewZ(texture2D(tDepth,uv).x,uNear,uFar);
          float rtF=1.0-smoothstep(70.0,220.0,wz);
          float vth=dd/max(0.25,v.y);
          float th0=mix(vth,max(sz0-wz,0.0),rtF);
          vec3 nv=(viewMatrix*vec4(n,0.0)).xyz,n0=(viewMatrix*vec4(0.0,1.0,0.0,0.0)).xyz;
          vec2 off=(nv.xy-n0.xy)*0.11*clamp(th0*0.6,0.0,1.0)*rtF;
          vec2 uv2=clamp(uv+off,vec2(0.002),vec2(0.998));
          float sz2=-perspectiveDepthToViewZ(texture2D(tDepth,uv2).x,uNear,uFar);
          if(sz2<wz-0.03){uv2=uv;sz2=sz0;}
          float th=mix(vth,max(sz2-wz,0.0),rtF);
          vec3 bed=texture2D(tScene,uv2).rgb;
          float lf=0.35+0.65*min(1.0,length(uSunCol)*0.6);
          float ab=1.0-exp(-th*uTurb*0.9);
          vec3 wcol=rvTm(mix(uShallow,uDeep,ab)*lf);
          vec3 body=mix(bed*mix(vec3(1.0),vec3(0.90,1.0,0.94),ab),wcol,clamp(ab*0.80,0.0,0.62));
          float rs=smoothstep(0.02,0.5,r.y);
          vec3 env=mix(vec3(0.08,0.11,0.08)*lf,sky,rs);
          vec3 res=mix(body,rvTm(env),clamp(fres,0.0,0.6))+rvTm(uSunCol*spec*0.45);
          float amt=0.0;
          if(uFoam>0.5){
            float fm=smoothstep(0.55,1.0,vSpeed)*0.85*(1.0-smoothstep(0.3,0.75,dd));
            float gr=smoothstep(0.38,0.72,rvFbm(vec2(q.x*7.0-t*2.6,q.y*7.0))*0.7+rvNoise(vec2(q.x*16.0-t*3.0,q.y*16.0))*0.3);
            float mk=0.0;
            if(fm>0.02){
              vec2 w=vec2(q.x,q.y+0.55*(rvFbm(vec2(q.x*0.30-t*0.9,q.y*0.7+11.0))-0.5));
              float s1=rvFbm(vec2(w.x*0.28-t*1.5,w.y*4.2));
              float s2=rvFbm(vec2(w.x*0.45-t*2.2+4.0,w.y*6.5+1.0));
              float pt=rvFbm(vec2(w.x*0.35-t*1.1,w.y*1.0+7.0));
              mk=fm*smoothstep(0.47,0.70,0.6*s1+0.4*s2+0.45*(pt-0.5))*(0.35+0.65*gr);}
            float act=max(smoothstep(0.35,0.95,vSpeed),min(1.0,vRock*1.2));
            float edge=1.0-smoothstep(0.015,0.20,th);
            float fnz=rvFbm(vWorld.xz*7.0+vec2(-t*0.4,t*0.2));
            float contact=edge*(0.12+0.88*act)*smoothstep(0.26,0.58,fnz+0.30*edge)*(0.45+0.55*gr);
            amt=max(mk*0.8,contact*0.7);
          }
          res=mix(res,rvTm(vec3(0.84,0.89,0.88)*(0.45+0.55*lf)),amt*0.34);   /* ECUME2 : moins blanche */
          if(uFogOn>0.5){float f=smoothstep(uFogNear,uFogFar,length(cameraPosition-vWorld));res=mix(res,rvTm(uFogCol),f);}
          gl_FragColor=vec4(res,smoothstep(0.0,0.05,vDepth)*(1.0-vHide));
          #include <encodings_fragment>
          return;
        }
        if(uFoam>0.5){
          float fm=smoothstep(0.45,0.95,vSpeed)*(1.0-smoothstep(0.3,0.75,dd));
          float mk=0.0;
          if(fm>0.02){
            vec2 w=vec2(q.x,q.y+0.55*(rvFbm(vec2(q.x*0.30-t*0.9,q.y*0.7+11.0))-0.5));
            float s1=rvFbm(vec2(w.x*0.28-t*1.5,w.y*4.2));
            float s2=rvFbm(vec2(w.x*0.45-t*2.2+4.0,w.y*6.5+1.0));
            float pt=rvFbm(vec2(w.x*0.35-t*1.1,w.y*1.0+7.0));
            float gr=smoothstep(0.38,0.72,rvFbm(vec2(w.x*7.0-t*2.6,w.y*7.0))*0.7+rvNoise(vec2(w.x*16.0-t*3.0,w.y*16.0))*0.3);
            mk=fm*smoothstep(0.47,0.70,0.6*s1+0.4*s2+0.45*(pt-0.5))*(0.35+0.65*gr);}
          if(vRock>0.02)mk=max(mk,smoothstep(0.38,0.72,rvFbm(vec2(q.x*4.5-t*2.4,q.y*4.5)))*vRock*0.35);
          float lum=0.40+0.60*min(1.0,length(uSunCol)*0.62);
          col=mix(col,vec3(0.88,0.92,0.91)*lum,mk*0.58);a=max(a,mk*0.48);
        }
        a*=smoothstep(0.0,0.06,vDepth);
        if(uFogOn>0.5){float f=smoothstep(uFogNear,uFogFar,length(cameraPosition-vWorld));col=mix(col,uFogCol,f);}
        if(!gl_FrontFacing){
          vec3 nd=-n;
          float ci=clamp(dot(nd,v),0.0,1.0);
          float win=smoothstep(0.60,0.72,ci);
          float dr=(ci-0.66)*16.0;
          float rim=exp(-dr*dr);
          vec3 bl=vec3(0.03,0.2,0.28);
          vec3 tir=mix(bl,uShallow*0.55,0.3)+vec3(0.05,0.13,0.16)*(1.0-ci);
          vec3 rd=refract(-v,nd,1.33);
          if(dot(rd,rd)<0.001)rd=vec3(0.0,1.0,0.0);
          vec3 skyW=mix(uHorizon,uZenith,clamp(rd.y*1.4,0.0,1.0))*vec3(0.78,0.95,1.0);
          float sdw=max(dot(normalize(rd),uSunDir),0.0);
          skyW+=uSunCol*(pow(sdw,60.0)*0.8+pow(sdw,600.0)*4.0);
          col=mix(tir,skyW,win)+vec3(0.10,0.26,0.32)*rim;
          a=0.97;
          a=max(a,rim*0.55);
        }
        a*=(1.0-vHide);
        gl_FragColor=vec4(col,a);
        #include <tonemapping_fragment>
        #include <encodings_fragment>
      }`});
  M.userData.rvWater=true;M.userData.rvRT=(shallow===c.CFG.waterCol.shallow);
  return M;
}
function updWaterMat(m,c){
  const u=m.uniforms;
  u.uFlow.value=c.ST.flow;u.uAnim.value=c.ST.anim;u.uFoam.value=c.ST.foam;u.uFogOn.value=c.ST.fog;
  u.uSunDir.value.copy(c.ENV.sunDir);u.uSunCol.value.copy(c.ENV.sunCol).multiplyScalar(c.ENV.light);
  u.uHorizon.value.copy(c.ENV.horizon);u.uZenith.value.copy(c.ENV.zenith);u.uFogCol.value.copy(c.ENV.fogCol);
}

/* ----- RVWQ : eau realiste. On rend d'abord la scene SANS l'eau (couleur + profondeur) dans une texture ; la surface de l'eau relit ensuite cette texture
   (refraction du fond, absorption selon l'epaisseur reelle, ecume la ou l'eau touche un rocher, une berge ou une tige). Cout : la scene est dessinee deux fois. ----- */
const RVWQ={on:true,rt:null,mats:[],scale:0.75,w:0,h:0,sz:new THREE.Vector2(),fr:0};
function rvWQSet(on){for(const m of RVWQ.mats){const u=m.uniforms;if(!u||!u.uRT)continue;const rt=on&&m.userData.rvRT&&RVWQ.rt;u.uRT.value=rt?1:0;
  if(rt){u.tScene.value=RVWQ.rt.texture;u.tDepth.value=RVWQ.rt.depthTexture;u.uRes.value.copy(RVWQ.sz);u.uNear.value=camera.near;u.uFar.value=camera.far;}}}
function rvWQRender(){
  renderer.shadowMap.needsUpdate=true;                                       // les ombres ne sont recalculees qu'une fois par image (autoUpdate coupe)
  if(RVWQ.fr++%20===0){RVWQ.mats=[];scene.traverse(o=>{const m=o.material;if(m&&!Array.isArray(m)&&m.userData&&m.userData.rvWater)RVWQ.mats.push(m);});}
  if(!RVWQ.on||UW.wet||ST.flood>=0.05||!RVWQ.mats.length){rvWQSet(0);return;}
  renderer.getDrawingBufferSize(RVWQ.sz);
  const w=Math.max(2,Math.round(RVWQ.sz.x*RVWQ.scale)),h=Math.max(2,Math.round(RVWQ.sz.y*RVWQ.scale));
  if(!RVWQ.rt||RVWQ.w!==w||RVWQ.h!==h){
    if(RVWQ.rt){RVWQ.rt.dispose();RVWQ.rt.depthTexture.dispose();}
    RVWQ.rt=new THREE.WebGLRenderTarget(w,h,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat,
      type:renderer.capabilities.isWebGL2?THREE.HalfFloatType:THREE.UnsignedByteType,depthBuffer:true,stencilBuffer:false,depthTexture:new THREE.DepthTexture(w,h,THREE.UnsignedIntType)});
    RVWQ.w=w;RVWQ.h=h;}
  const ms=RVWQ.mats;ms.forEach(m=>{m.visible=false;});
  const prev=renderer.getRenderTarget();
  renderer.setRenderTarget(RVWQ.rt);renderer.render(scene,camera);renderer.setRenderTarget(prev);
  ms.forEach(m=>{m.visible=true;});
  rvWQSet(1);
}

/* ----- Module : ciel (degrade + soleil visible) ----- */
defModule({id:"ciel",nom:{fr:"Ciel",en:"Sky"},
  build(c){
    const u={uZenith:{value:new THREE.Color()},uHorizon:{value:new THREE.Color()},uGround:{value:new THREE.Color()},
             uSunDir:{value:new THREE.Vector3()},uSunCol:{value:new THREE.Color()}};
    const m=new THREE.ShaderMaterial({uniforms:u,side:THREE.BackSide,depthWrite:false,
      vertexShader:`varying vec3 vDir;void main(){vDir=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
      fragmentShader:`uniform vec3 uZenith,uHorizon,uGround,uSunDir,uSunCol;varying vec3 vDir;
        void main(){vec3 d=normalize(vDir);float y=d.y;
          vec3 c=y>0.0?mix(uHorizon,uZenith,pow(y,0.55)):mix(uHorizon,uGround,pow(-y,0.35));
          float s=max(dot(d,uSunDir),0.0);
          c+=uSunCol*(smoothstep(0.99955,0.9998,s)*14.0+pow(s,350.0)*0.9+pow(s,40.0)*0.25+pow(s,6.0)*0.12);
          gl_FragColor=vec4(c,1.0);
          #include <tonemapping_fragment>
          #include <encodings_fragment>
        }`});
    const mesh=new THREE.Mesh(new THREE.SphereGeometry(2500,48,24),m);
    mesh.renderOrder=-1;mesh.frustumCulled=false;mesh.userData.u=u;return mesh;
  },
  update(c){
    const o=this.obj,u=o.userData.u;o.position.copy(c.camera.position);
    u.uZenith.value.copy(c.ENV.zenith);u.uHorizon.value.copy(c.ENV.horizon);u.uGround.value.copy(c.ENV.ground);
    u.uSunDir.value.copy(c.ENV.sunDir);u.uSunCol.value.copy(c.ENV.sunCol);
  }
});

/* ----- Module : relief (lit, berges, lit majeur, talus, versants) -----

defModule({id:"terrain",nom:{fr:"Relief et lit",en:"Terrain and bed"},
  build(c){
